  method: per-endpoint openapi files linked from the docs sitemap
  ingested: '2026-07-28'
  spec_urls:
  - https://docs.justoneapi.com/en/sitemap.xml
  - https://docs.justoneapi.com/openapi/<platform>/<endpoint>-en.json
