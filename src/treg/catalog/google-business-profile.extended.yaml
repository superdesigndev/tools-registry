- id: google-business-profile.x.businessinformation-mybusinessbusinessinformation-attributes-list
  kind: utility
  tier: extended
  platform: google-business
  method: GET
  path: /v1/attributes
  name: "Available listing attributes by category and country"
  summary: attributes.list — Returns the list of attributes that would be available for a location with the given primary category and country.
  scope: own_account
  host: mybusinessbusinessinformation.googleapis.com
  cost: *id001
  docs_url: https://developers.google.com/my-business/reference/mybusinessbusinessinformation/rest
  input:
    queryParams:
      categoryName:
        type: string
        required: false
        note: Optional. The primary category stable ID to find available attributes. Must be of the format `categories/{category_id}` (e.g., `categories/gcid:restaurant`). Required if `parent` is not set and `show_all` is false.
      languageCode:
        type: string
        required: false
        note: Optional. The BCP 47 code of language to get attribute display names in. If this language is not available, they will be provided in English.
      pageSize:
        type: integer
        required: false
        note: How many attributes to include per page. Default is 200, minimum is 1.
      pageToken:
        type: string
        required: false
        note: If specified, the next page of attribute metadata is retrieved.
      parent:
        type: string
        required: false
        note: 'Optional. Resource name of the location to look up available attributes. If this field is set, `category_name`, `region_code`, `language_code` and `show_all` are not required and must not be set. Format: `locations/{location_id}` (e.g., `locations/1234567890`).'
      regionCode:
        type: string
        required: false
        note: Optional. The ISO 3166-1 alpha-2 country code to find available attributes. Required if `parent` is not set.
      showAll:
        type: boolean
        required: false
        note: Optional. If set to true, metadata for all available attributes are returned, disregarding `parent` and `category_name` fields. `language_code` and `region_code` are required when `show_all` is set to true.
  capability: google-business.attributes.catalog
