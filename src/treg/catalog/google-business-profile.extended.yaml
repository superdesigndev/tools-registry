        required: false
        note: Day of a month. Must be from 1 to 31 and valid for the year and month, or 0 to specify a year by itself or a year and month where the day isn't significant.
      dailyRange.startDate.month:
        type: integer
        required: false
        note: Month of a year. Must be from 1 to 12, or 0 to specify a year without a month and day.
      dailyRange.startDate.year:
        type: integer
        required: false
        note: Year of the date. Must be from 1 to 9999, or 0 to specify a date without a year.
      dailySubEntityType.dayOfWeek:
        type: string
        required: false
        note: 'Represents the day of the week. Eg: MONDAY. Currently supported DailyMetrics = NONE.'
        enum:
        - DAY_OF_WEEK_UNSPECIFIED
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      dailySubEntityType.timeOfDay.hours:
        type: integer
        required: false
        note: Hours of a day in 24 hour format. Must be greater than or equal to 0 and typically must be less than or equal to 23. An API may choose to allow the value "24:00:00" for scenarios like business closing time.
      dailySubEntityType.timeOfDay.minutes:
        type: integer
        required: false
        note: Minutes of an hour. Must be greater than or equal to 0 and less than or equal to 59.
      dailySubEntityType.timeOfDay.nanos:
        type: integer
        required: false
        note: Fractions of seconds, in nanoseconds. Must be greater than or equal to 0 and less than or equal to 999,999,999.
      dailySubEntityType.timeOfDay.seconds:
        type: integer
        required: false
        note: Seconds of a minute. Must be greater than or equal to 0 and typically must be less than or equal to 59. An API may allow the value 60 if it allows leap-seconds.
  capability: google-business.insights
