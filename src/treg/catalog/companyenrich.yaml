    summary: "Searches states by name or country codes — returns up to 100 states per page"
    input:
      body:
        query: {type: string, required: false, note: "state or province name; prefixes DO work here ('cali' matched California)", example: "cali"}
        countryCodes: {type: "array[string]", required: false, note: "ISO alpha-2 codes to scope the search", example: ["US"]}
        page: {type: integer, required: false, note: "1-based page number"}
      note: "FREE. Returns numeric state `id`s — those integers, not the names, are what the `states` filter on company search takes."
