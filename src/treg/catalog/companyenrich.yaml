provider: companyenrich
source:
  docs: https://docs.companyenrich.com
  openapi: https://docs.companyenrich.com/llms.txt  # no single spec file is published; each reference page embeds an
                                                    # OpenAPI 3.0.1 fragment, reachable by appending .md to its URL
                                                    # (e.g. https://docs.companyenrich.com/reference/post_people-search.md).
                                                    # The fragments all declare servers: https://api.companyenrich.com.
  curated: '2026-08-20'
limits: "500 requests/minute per IP globally; per-user route limits scale with plan (60/min Starter, 120/min Pro, 600/min Scale). Autocomplete/lookup routes use a separate per-user bucket."
pricing_url: https://companyenrich.com/pricing

# CURATED + LIVE-VERIFIED 2026-08-20 against a real trial key (500 credits). Everything with a
# `verified:` stamp below was called for real and its example response is the truncated, PII-scrubbed
# body that came back.
#
# BILLING. One shared credit pool, spent per call or per RESULT depending on the route. The account
# route GET /me returns {credits:{used,total}}, so the meter is readable — every paid cost block here
# was confirmed by calling the endpoint and watching `used` move by exactly the documented amount:
#   enrich 1 · get-by-id 1 · workforce 5 · company search 1/company · similar 5/company
#   people search 2/person · people get 2 · people lookup 5 · people email 10
# The SEARCH routes are the ones to watch: `pageSize` IS the price (1 credit per company, 2 per
# person, 5 per similar company), and an empty result set still bills the one-unit minimum. Always
# probe a new filter set with the free /count route before paying for rows.
#
# FREE ROUTES ARE THE POINT OF THE INTEGRATION. Counts, all four autocompletes, the industry
# taxonomy, every geo lookup, /me and every async job-status route cost zero credits (confirmed: the
# meter did not move). An agent can compose an entire audience definition for free and only pay at
# the moment it materializes rows.
#
# NO ROUTING. This file describes what CompanyEnrich can do; where another provider in the catalog
# implements the same capability, the caller compares and chooses. Nothing here fails over.
#
# NOT MODELLED (deliberate):
#   - /lists/companies CRUD (5 routes). A saved-list workspace feature bound to the vendor dashboard;
#     `capabilities.lists` was false on the trial account, so it is untestable and adds no capability
#     an agent cannot get from search + the caller's own storage.
#   - /companies/logo/{id} and /people/image/{id}. Binary asset redirects, not data.
#   - Webhook delivery. The async routes accept `webhook_url`; treg's proxy cannot receive callbacks,
#     so the poll endpoints below are the honest interface. They are free, so polling is free.

proposed_capabilities:
  companies.autocomplete: "Autocomplete a company by partial domain or name"
  companies.similar: "Find companies similar to a seed company"
  companies.search.count: "Count how many companies match a filter, before paying for rows"
  companies.enrich.bulk.start: "Queue a bulk company-enrichment job"
  companies.enrich.bulk.status: "Check a bulk company-enrichment job"
  companies.enrich.bulk.list: "List your bulk company-enrichment jobs"
  companies.export.start: "Queue a large company-search export"
  companies.export.status: "Check a company-search export job"
  companies.export.list: "List your company-search export jobs"
  companies.industries.list: "List the industry taxonomy with NAICS codes"
  companies.keywords.autocomplete: "Autocomplete company-description keywords"
  companies.technologies.autocomplete: "Autocomplete technology-stack names"
  companies.geo.regions: "List world regions usable as location filters"
  companies.geo.countries: "Look up countries usable as location filters"
  companies.geo.states: "Look up states or provinces usable as location filters"
  companies.geo.cities: "Look up cities usable as location filters"
  people.positions.autocomplete: "Autocomplete job titles for people search"
  people.export.start: "Queue a large people-search export"
  people.export.status: "Check a people-search export job"
  people.export.list: "List your people-search export jobs"
  people.email.bulk.start: "Queue a bulk work-email lookup job"
  people.email.bulk.status: "Check a bulk work-email lookup job"
  account.jobs.list: "List every background job on your account"
  account.jobs.get: "Get one background job's details"

endpoints:

  # ---------------------------------------------------------------------------------------------
  # Company enrichment
  # ---------------------------------------------------------------------------------------------
  - id: companyenrich.companies.enrich
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: GET
    path: /companies/enrich
    name: "Enrich a company by domain"
    summary: "Enriches a company using its domain name as lookup parameter"
    input:
      queryParams:
        domain: {type: string, required: true, note: "company domain, no protocol or www; max 1024 chars", example: "stripe.com"}
        expand: {type: "array[string]", required: false, note: "repeat the parameter per expansion. `workforce` adds the department headcount block and costs 5 EXTRA credits", example: "workforce"}
      note: "the preferred lookup — one domain maps to exactly one company. A domain with no company behind it returns HTTP 404, not an empty body. The response carries firmographics, description, industries, NAICS, socials, technologies and funding."
    test_request:
      queryParams: {domain: "stripe.com"}
    cost:
      type: per_call
      value: 1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit per call. VERIFIED live 2026-08-20 by reading GET /me before and after — the credit meter moved by exactly 1. `expand=workforce` adds 5 credits."
    docs_url: https://docs.companyenrich.com/reference/get_companies-enrich
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.enrich.json

  - id: companyenrich.companies.enrich.by_properties
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /companies/enrich
    name: "Enrich a company by name or social profile"
    summary: "Enriches a company using its properties — best match is used in case of ambiguity"
    input:
      body:
        name: {type: string, required: false, note: "company name", example: "Anthropic"}
        linkedinUrl: {type: string, required: false, note: "company LinkedIn page URL", example: "https://www.linkedin.com/company/anthropicresearch"}
        linkedinId: {type: string, required: false, note: "numeric LinkedIn company id"}
        twitterUrl: {type: string, required: false, note: "company X/Twitter profile URL"}
        facebookUrl: {type: string, required: false, note: "company Facebook page URL"}
        instagramUrl: {type: string, required: false, note: "company Instagram profile URL"}
        youTubeUrl: {type: string, required: false, note: "company YouTube channel URL"}
      queryParams:
        expand: {type: "array[string]", required: false, note: "`workforce` costs 5 EXTRA credits"}
      note: "at least ONE of the seven properties must be supplied. Use this only when you do not have a domain — the domain route is deterministic, this one is a best-match and can resolve to the wrong company for a generic name. Supplying both a name and a social URL narrows it considerably."
    test_request:
      body: {name: "Anthropic", linkedinUrl: "https://www.linkedin.com/company/anthropicresearch"}
    cost:
      type: per_call
      value: 1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit per call, VERIFIED against the live credit meter 2026-08-20."
    docs_url: https://docs.companyenrich.com/reference/post_companies-enrich
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.enrich.by_properties.json

  - id: companyenrich.companies.enrich.batch
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /companies/enrich/batch
    name: "Enrich up to 50 companies by domain in one call"
    summary: "Enriches a list of companies using their domain names — up to 50 domains per request"
    input:
      body:
        domains: {type: "array[string]", required: true, note: "1-50 company domains. THIS IS THE PRICE DIAL — 1 credit per domain enriched", example: ["stripe.com", "anthropic.com"]}
      queryParams:
        expand: {type: "array[string]", required: false, note: "`workforce` costs 5 EXTRA credits per company"}
      note: "returns a plain ARRAY of company objects (not an envelope). This is the synchronous batch — it answers in the same request. For more than 50 domains use the async bulk job (companyenrich.companies.enrich.bulk.start), which takes up to 10,000."
    test_request:
      body: {domains: ["stripe.com", "anthropic.com"]}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit per domain enriched. VERIFIED 2026-08-20: a 2-domain batch moved the credit meter by exactly 2."
    docs_url: https://docs.companyenrich.com/reference/post_companies-enrich-batch
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.enrich.batch.json

  - id: companyenrich.companies.get
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: GET
    path: /companies
    name: "A company record by CompanyEnrich id"
    summary: "Gets a company information by its CompanyEnrich ID"
    input:
      queryParams:
        id: {type: string, required: true, note: "the UUID returned in the `id` field of any enrich or search result", example: "0192577c-1d7a-715c-a5b7-1b9b530445e0"}
        expand: {type: "array[string]", required: false, note: "`workforce` costs 5 EXTRA credits"}
      note: "re-fetching by id costs the same 1 credit as enriching by domain, so cache the enrich response rather than round-tripping ids."
    test_request:
      queryParams: {id: "0192577c-1d7a-715c-a5b7-1b9b530445e0"}
    cost:
      type: per_call
      value: 1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit per call, VERIFIED against the live credit meter 2026-08-20."
    docs_url: https://docs.companyenrich.com/reference/get_companies
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.get.json

  - id: companyenrich.companies.workforce
    domain: companies
    capability: companies.headcount_trend
    platform: companies
    scope: any_account
    method: GET
    path: /companies/workforce
    name: "Company headcount by department, with history"
    summary: "Returns workforce insights for a single company — observed employee count, range bucket, and headcounts grouped by root departments"
    input:
      queryParams:
        domain: {type: string, required: false, note: "company domain — supply EXACTLY ONE of domain or id", example: "stripe.com"}
        id: {type: string, required: false, note: "CompanyEnrich company UUID — supply EXACTLY ONE of domain or id"}
      note: "the strongest signal in this provider. Returns observed_employee_count, employee_count_range, department_headcount across 14 root departments (engineering_technical, sales, c_suite, …), unclassified_headcount, and a `history` array of the same shape per month — that history is what makes growth rates computable without repeated polling."
    test_request:
      queryParams: {domain: "stripe.com"}
    cost:
      type: per_success
      value: 5
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "5 credits per SUCCESSFUL call. VERIFIED 2026-08-20 against the live credit meter."
    docs_url: https://docs.companyenrich.com/reference/get_companies-workforce
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.workforce.json

  - id: companyenrich.companies.autocomplete
    domain: companies
    capability: companies.autocomplete
    platform: companies
    scope: any_account
    method: GET
    path: /companies/autocomplete
    name: "Resolve a company name to its domain (free autocomplete)"
    summary: "Returns a list of companies matching the given partial domain name — up to 10 companies per request"
    input:
      queryParams:
        query: {type: string, required: true, note: "partial domain or company name", example: "stripe"}
      note: "FREE, so this is the correct way to turn a fuzzy company name into a canonical domain BEFORE spending a credit on enrichment. Returns {domain, name, logoUrl} only."
    test_request:
      queryParams: {query: "stripe"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'documented FREE and confirmed live 2026-08-20 — the credit meter did not move'}
    docs_url: https://docs.companyenrich.com/reference/get_companies-autocomplete
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.autocomplete.json

  # ---------------------------------------------------------------------------------------------
  # Company search
  # ---------------------------------------------------------------------------------------------
  - id: companyenrich.companies.search
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /companies/search
    name: "Search companies by firmographics, tech stack or keywords"
    summary: "Searches companies based on given criteria — name, domain, industry, employees, revenue, founded year, and more"
    input:
      body:
        page: {type: integer, required: false, note: "1-based page number; page * pageSize may not exceed 10,000 — past that use the scroll route", example: 1}
        pageSize: {type: integer, required: false, note: "1-100, default 10. THIS IS THE PRICE — 1 credit per company returned", example: 1}
        query: {type: string, required: false, note: "free-text match on company name and domain, max 250 chars"}
        semanticQuery: {type: string, required: false, note: "natural-language description of the companies you want; costs 2 credits per company instead of 1", example: "companies that sell payment infrastructure to developers"}
        semanticWeight: {type: number, required: false, note: "0-1, default 0.7 — higher favours semantic similarity over the structured filters"}
        technologies: {type: "array[string]", required: false, note: "technology-stack names; resolve them first with the free /technologies/autocomplete", example: ["stripe"]}
        keywords: {type: "array[string]", required: false, note: "description keywords; resolve them first with the free /keywords/autocomplete"}
        countries: {type: "array[string]", required: false, note: "ISO 3166-1 alpha-2 codes", example: ["US"]}
        regions: {type: "array[string]", required: false, note: "region ids from the free GET /geo/regions"}
        states: {type: "array[integer]", required: false, note: "state ids from the free POST /geo/states"}
        cities: {type: "array[integer]", required: false, note: "city ids from the free POST /geo/cities"}
        employees: {type: "array[string]", required: false, note: "employee-count buckets, e.g. 1-10, 5K-10K, over-10K"}
        reportedEmployees: {type: "array[string]", required: false, note: "same buckets, but the externally reported figure"}
        workforceSize: {type: "array[object]", required: false, note: "absolute headcount ranges, finer-grained than the buckets"}
        workforceGrowth: {type: object, required: false, note: "filter by headcount growth rate over a window"}
        revenue: {type: "array[string]", required: false, note: "revenue buckets, e.g. over-1b"}
        category: {type: "array[string]", required: false, note: "b2b, b2c, b2g, saas, marketplace, service-provider …"}
        type: {type: "array[string]", required: false, note: "private, public, nonprofit, educational, government"}
        naicsCode: {type: "array[integer]", required: false, note: "2-6 digit NAICS; a short code matches all its children"}
        foundedYear: {type: object, required: false, note: "range object, e.g. {min: 2015, max: 2022}"}
        fundingRounds: {type: "array[string]", required: false, note: "seed, series-a, …"}
        fundingAmount: {type: object, required: false, note: "range object in USD"}
        fundingYear: {type: object, required: false, note: "range object"}
        require: {type: "array[string]", required: false, note: "features that MUST be present on the company record"}
        exclude: {type: object, required: false, note: "domains/companies to drop; the per-search exclude cap is plan-bound (500 Starter → 50,000 Scale)"}
        categoryOperator: {type: string, required: false, note: "and | or — how multiple `category` values combine"}
        keywordsOperator: {type: string, required: false, note: "and | or"}
        technologiesOperator: {type: string, required: false, note: "and | or"}
        lists: {type: "array[integer]", required: false, note: "restrict to saved list ids (dashboard feature, plan-gated)"}
      queryParams:
        expand: {type: "array[string]", required: false, note: "`workforce` costs 5 EXTRA credits PER COMPANY returned — expensive on a search"}
      note: "ALWAYS call companyenrich.companies.search.count first: it is free and tells you the match total, so you never buy an unexpectedly large page. An empty result set still bills the 1-credit minimum. Deep pagination past 10,000 rows requires the scroll route."
    test_request:
      body: {pageSize: 1, page: 1, technologies: ["stripe"], countries: ["US"]}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit PER COMPANY RETURNED — `pageSize` is the price. 1-credit minimum when nothing matches. A `semanticQuery` search is 2 credits per company instead. VERIFIED 2026-08-20: pageSize 1 moved the meter by exactly 1."
    docs_url: https://docs.companyenrich.com/reference/post_companies-search
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.search.json

  - id: companyenrich.companies.search.scroll
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /companies/search/scroll
    name: "Scroll company search results past 10,000 rows"
    summary: "Searches companies with cursor-based pagination — allows paginating into more than 10.000 results"
    input:
      body:
        pageSize: {type: integer, required: false, note: "1-100. THIS IS THE PRICE — 1 credit per company returned", example: 1}
        cursor: {type: string, required: false, note: "omit for the first page; then pass the `next_cursor` from the previous response"}
      note: "identical filter set to companyenrich.companies.search (every field listed there applies here) — only the pagination differs: a cursor instead of a page number, and no 10,000-row ceiling. Prefer this for any full-audience export you intend to walk; prefer the async export job for anything over a few thousand rows."
    test_request:
      body: {pageSize: 1, technologies: ["stripe"], countries: ["US"]}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "1 credit per company returned, 1-credit minimum on an empty page. VERIFIED live 2026-08-20."
    docs_url: https://docs.companyenrich.com/reference/post_companies-search-scroll
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.search.scroll.json

  - id: companyenrich.companies.search.count
    domain: companies
    capability: companies.search.count
    platform: companies
    scope: any_account
    method: POST
    path: /companies/search/count
    name: "Count companies matching a filter (free)"
    summary: "Returns the total count of companies matching the given search criteria without retrieving the actual results"
    input:
      body:
        technologies: {type: "array[string]", required: false, note: "same filter object as companyenrich.companies.search — every field there is accepted here", example: ["stripe"]}
        countries: {type: "array[string]", required: false, note: "ISO alpha-2 codes", example: ["US"]}
      note: "FREE and it takes the entire search filter object, so it is the correct first call of any audience-building loop: tune filters here at zero cost, then spend credits once on the real search. Returns {count, total} where `count` is capped at the plan's page limit and `total` is the true match count."
    test_request:
      body: {technologies: ["stripe"], countries: ["US"]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'documented FREE and confirmed live 2026-08-20 — the credit meter did not move'}
    docs_url: https://docs.companyenrich.com/reference/post_companies-search-count
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.search.count.json

  - id: companyenrich.companies.search.preview
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /companies/search/preview
    name: "Preview the top 25 company search results (free, Scale plan)"
    summary: "Returns the top 25 results for free, perfect for previewing search results before running a full search"
    input:
      body:
        technologies: {type: "array[string]", required: false, note: "same filter object as companyenrich.companies.search"}
        countries: {type: "array[string]", required: false, note: "ISO alpha-2 codes"}
      note: "PLAN-GATED. Only accounts on the vendor's top tier can call this; every other plan gets HTTP 403 with detail 'Your plan does not include access to preview functionality.' Check `capabilities.previews` on GET /me before calling. When available it is strictly better than paying for a first page."
    test_request:
      body: {technologies: ["stripe"], countries: ["US"]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'free where the plan allows it; the plan requirement, not the credit price, is the gate'}
    docs_url: https://docs.companyenrich.com/reference/post_companies-search-preview
    # NOT VERIFIED: the test credential is a trial account with capabilities.previews=false. The route
    # answered 403 with the plan-upgrade message on 2026-08-20 — the path and auth are therefore proven
    # correct, but no successful response was observed, so no example is committed.

  # ---------------------------------------------------------------------------------------------
  # Similar companies (lookalikes)
  # ---------------------------------------------------------------------------------------------
  - id: companyenrich.companies.similar
    domain: companies
    capability: companies.similar
    platform: companies
    scope: any_account
    method: POST
    path: /companies/similar
    name: "Lookalike companies for a seed domain or id"
    summary: "Finds similar companies to the given company by id or domain — at most 100 companies are returned per request"
    input:
      body:
        domains: {type: "array[string]", required: false, note: "1-10 seed domains; the result is similar to the SET, so several seeds sharpen the profile", example: ["stripe.com"]}
        domain: {type: string, required: false, note: "DEPRECATED single-seed form — use `domains`"}
        page: {type: integer, required: false, note: "1-based page number", example: 1}
        pageSize: {type: integer, required: false, note: "1-100. THIS IS THE PRICE — 5 credits per company returned", example: 1}
        similarityWeight: {type: number, required: false, note: "-1 to 1, default 0; higher weights raw similarity over the structured filters"}
        minScore: {type: number, required: false, note: "0-1 floor on the similarity score"}
        countries: {type: "array[string]", required: false, note: "narrow the lookalikes by geography — every companyenrich.companies.search filter is accepted here too"}
        employees: {type: "array[string]", required: false, note: "narrow by size bucket"}
      note: "THE MOST EXPENSIVE ROW-PRICED ROUTE — 5 credits per company, so a default pageSize of 10 is 50 credits. Call companyenrich.companies.similar.count first (free) and set pageSize explicitly, every time."
    test_request:
      body: {domains: ["stripe.com"], pageSize: 1, page: 1}
    cost:
      type: per_result
      value: 5
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "5 credits PER COMPANY RETURNED, and 5 credits even when nothing matches. VERIFIED 2026-08-20: pageSize 1 moved the credit meter by exactly 5."
    docs_url: https://docs.companyenrich.com/reference/post_companies-similar
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.similar.json

  - id: companyenrich.companies.similar.scroll
    domain: companies
    capability: companies.similar
    platform: companies
    scope: any_account
    method: POST
    path: /companies/similar/scroll
    name: "Scroll lookalike-company results past 10,000 rows"
    summary: "Finds similar companies with cursor-based pagination — allows paginating into more than 10.000 results"
    input:
      body:
        domains: {type: "array[string]", required: false, note: "1-10 seed domains", example: ["stripe.com"]}
        pageSize: {type: integer, required: false, note: "1-100. THIS IS THE PRICE — 5 credits per company returned", example: 1}
        cursor: {type: string, required: false, note: "omit for the first page, then pass `next_cursor` from the previous response"}
      note: "same filters and same 5-credit-per-row price as companyenrich.companies.similar; only the pagination differs. At 5 credits a row, walking a lookalike list this way gets expensive fast — the async export job reserves credits up front and is the safer shape for large pulls."
    test_request:
      body: {domains: ["stripe.com"], pageSize: 1}
    cost:
      type: per_result
      value: 5
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://companyenrich.com/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "5 credits per company returned, 5 on an empty page. VERIFIED live 2026-08-20."
    docs_url: https://docs.companyenrich.com/reference/post_companies-similar-scroll
    verified: '2026-08-20'
    example_response: examples/companyenrich.companies.similar.scroll.json

  - id: companyenrich.companies.similar.count
    domain: companies
    capability: companies.search.count
    platform: companies
    scope: any_account
    method: POST
    path: /companies/similar/count
    name: "Count lookalike companies for a seed (free)"
    summary: "Returns the total count of similar companies matching the given search criteria without retrieving the actual results"
    input:
      body:
        domains: {type: "array[string]", required: false, note: "1-10 seed domains", example: ["stripe.com"]}
