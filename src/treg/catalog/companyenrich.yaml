    input:
      body:
        page: {type: integer, required: false, note: "1-based; page * pageSize may not exceed 10,000 — past that use the scroll route", example: 1}
        pageSize: {type: integer, required: false, note: "1-100, default 10. THIS IS THE PRICE — 2 credits per PERSON returned, so a default page costs 20 credits", example: 1}
