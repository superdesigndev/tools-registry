        positionQuery: {type: "array[string]", required: false, note: "free-text matches on the person's CURRENT job title; resolve real titles first with the free /positions/autocomplete", example: ["Chief Executive Officer"]}
        seniority: {type: "array[string]", required: false, note: "one or more of owner, founder, c-suite, partner, vp, head, director, manager, senior, entry, intern. NOTE the hyphen in `c-suite` — an underscore is rejected with a bodyless HTTP 400", example: ["c-suite"]}
        department: {type: "array[string]", required: false, note: "hierarchical department slugs, e.g. c-suite/finance-executive, engineering-technical/data-science"}
        countries: {type: "array[string]", required: false, note: "ISO 3166-1 alpha-2 codes"}
        query: {type: string, required: false, note: "free-text match on the employer's name and domain, max 250 chars"}
        companyFilter: {type: object, required: false, note: "a nested company lookup — search people at companies matching firmographic criteria rather than a fixed domain list"}
