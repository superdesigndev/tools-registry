    domain: companies
    capability: companies.geo.countries
    platform: companies
    scope: any_account
    method: POST
    path: /geo/countries
    name: "Search countries by name"
    summary: "Searches countries by name — returns up to 100 countries per page"
    input:
      body:
        query: {type: string, required: false, note: "country name. WHOLE WORDS ONLY — verified live 2026-08-20: 'United States' and 'Ireland' match, but the prefix 'germ' returns zero items. Omit it to page through every country", example: "United States"}
        page: {type: integer, required: false, note: "1-based page number"}
      note: "FREE. Name-to-code resolution for the `countries` filter. Because matching is whole-word rather than prefix, feed it a full country name, not a fragment."
