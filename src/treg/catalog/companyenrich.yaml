      body: {query: "san fran", countryCodes: ["US"]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'documented FREE and confirmed live 2026-08-20'}
    docs_url: https://docs.companyenrich.com/reference/post_geo-cities
    verified: '2026-08-20'
    example_response: examples/companyenrich.geo.cities.search.json

