    summary: "Searches cities by name or country codes — returns up to 100 cities per page"
    input:
      body:
        query: {type: string, required: false, note: "city name; prefixes work ('san fran' matched three San Francisco entries)", example: "san fran"}
        countryCodes: {type: "array[string]", required: false, note: "ISO alpha-2 codes to scope the search", example: ["US"]}
        page: {type: integer, required: false, note: "1-based page number"}
      note: "FREE. Returns numeric city `id`s for the `cities` filter. Expect near-duplicates for one metro ('San Francisco', 'City and County of San Francisco', 'South San Francisco') — pass all the ids you mean, or you will silently narrow the audience."
