    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: page
      source: docs
      source_url: https://serpstat.com/pay/
      checked: '2026-07-28'
      confidence: documented
      note: 1 API credit per returned page — `size` is the cost dial, and an empty result still bills the 1-credit minimum.
    docs_url: https://api-docs.serpstat.com/docs/serpstat-public-api/xu9jnzib39dsn-backlinks-api

  # --- Account (free) ---------------------------------------------------------------------------
  - id: serpstat.account.usage
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: POST
    path: /
    name: "Account usage — credit limits and credits remaining"
    summary: "Check the calling account's API credit limits and how many credits are left"
    input:
      bodyType: json
      body:
        method: {type: string, required: true, example: "SerpstatLimitsProcedure.getStats"}
        params: {type: object, required: true, note: "takes no fields — send an empty object {}"}
        id: {type: string, required: false, example: "1"}
      note: |
        Takes no parameters but `params` must still be present as `{}`. This is the right call to
        make BEFORE any large `size` sweep, since every list method in this file is metered per row.
        See the registry-discrepancy note in the file header: this spelling (no "Api" infix) is the
        one that works live; treg's probe sends it too.
        Any captured example must have the account's real balances masked before commit.
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      note: the limits/credits meter itself does not consume credits — the standard pattern for this class of endpoint, and what makes it the correct liveness probe for a Serpstat token. Confirmed live 2026-08-11 (used_lines stayed 0 after the call).
    docs_url: https://api-docs.serpstat.com/docs/serpstat-public-api/
