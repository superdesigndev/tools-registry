# unverified — endpoints require a connected OAuth account; verify via a treg connection later.
#
# Meta Marketing API on graph.facebook.com/v25.0 with the connected person's user token. Unlike
# Google Ads this needs no second credential — there is no developer-token equivalent — so a
# connect here yields a callable tool on its own. Everything is own_account: these are the ad
# accounts the member has a Business role on.
#
# Scopes granted: ads_read + business_management (`read`), plus ads_management on `manage`.
# business_management is what makes /me/adaccounts return anything at all (it is a Business asset
# listing), so a read-only connection still needs it.
#
# Platform slug is `facebook` because that is where the marketplace shelves Meta — the ads
# themselves run across Facebook, Instagram, Messenger and Audience Network from one account.
# The competitive/any_account view of Meta ads is a different job entirely (the Ad Library), served
# by the META_AD_LIBRARY provider, not from here: this file is your OWN spend.
provider: meta-ads
source:
  docs: https://developers.facebook.com/docs/marketing-apis
  openapi: null
  curated: 2026-07-28

limits: "per-app and per-ad-account rate limiting; read X-Business-Use-Case-Usage"
pricing_url: https://developers.facebook.com/docs/marketing-apis/  # The Graph API is free; the ad spend it manages is not.
endpoints:
  - id: meta-ads.accounts
    capability: meta-ads.accounts
    platform: meta-ads
    scope: own_account
    method: GET
    path: /me/adaccounts
    name: "Meta ad accounts you can access"
    summary: "List the Meta ad accounts you can access, with their names and currencies"
    input:
      queryParams:
        fields: {type: string, required: true, example: "id,name,account_id,account_status,currency,timezone_name,amount_spent,balance"}
        limit: {type: integer, required: false, example: 100}
      note: "`id` comes back prefixed — act_1234567890 — and that PREFIXED form is what the other endpoints' path takes; account_id is the bare number. Money fields (amount_spent, balance) are strings in the account currency's MINOR unit (cents). This is also treg's connection resource picker"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account; Meta throttles per app and per ad account (rate-limit headroom is reported in the x-business-use-case-usage response header) rather than charging per call}
    test_request:
      queryParams: {limit: 2}
    verified: 2026-07-28
    example_response: examples/meta-ads.accounts.json
    docs_url: https://developers.facebook.com/docs/marketing-api/reference/ad-account

  - id: meta-ads.campaigns
    capability: meta-ads.campaigns
    platform: meta-ads
    scope: own_account
    method: GET
    path: /{ad_account_id}/campaigns
    name: "Campaigns in your Meta ad account — status, budget"
    summary: "List the campaigns in your Meta ad account with status, objective and budget"
    input:
      pathParams:
        ad_account_id: {type: string, required: true, note: "the act_-prefixed id from facebook.ads.accounts", example: "act_1234567890"}
      queryParams:
        fields: {type: string, required: true, example: "id,name,status,effective_status,objective,daily_budget,lifetime_budget,start_time,stop_time,created_time"}
        effective_status: {type: string, required: false, note: "JSON array as a string, e.g. [\"ACTIVE\",\"PAUSED\"] — without it Meta also returns archived campaigns", example: "[\"ACTIVE\"]"}
        limit: {type: integer, required: false, example: 50}
        after: {type: string, required: false, note: "paging.cursors.after from the previous response"}
      note: "budgets are strings in the account currency's MINOR unit — daily_budget \"5000\" is $50.00. Budget can live on the campaign (CBO) or on each ad set, so a null daily_budget here is normal, not missing data. Ad sets and ads are the same pattern on /{ad_account_id}/adsets and /ads"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account / platform rate limits apply}
    test_request:
      pathParams: {ad_account_id: "act_1203093248302225"}
      queryParams: {limit: 2}
    verified: 2026-07-28
    example_response: examples/meta-ads.campaigns.json
    docs_url: https://developers.facebook.com/docs/marketing-api/reference/ad-campaign-group

  - id: meta-ads.insights
    capability: meta-ads.insights
    platform: meta-ads
    scope: own_account
    method: GET
    path: /{object_id}/insights
    name: "Your Meta ads' spend, impressions, clicks, conversions"
    summary: "Get spend, impressions, clicks and conversions for your Meta ads"
    input:
      pathParams:
        object_id: {type: string, required: true, note: "ANY level of the hierarchy: act_… for the whole account, or a campaign / ad set / ad id to scope it down", example: "act_1234567890"}
      queryParams:
        fields: {type: string, required: true, note: "comma-separated metrics", example: "spend,impressions,clicks,ctr,cpc,cpm,reach,frequency,actions,action_values"}
        date_preset: {type: string, required: false, note: "today | yesterday | last_7d | last_14d | last_30d | this_month | maximum — mutually exclusive with time_range", example: "last_30d"}
        time_range: {type: string, required: false, note: "JSON as a string: {\"since\":\"2026-07-01\",\"until\":\"2026-07-28\"}"}
        level: {type: string, required: false, note: "account | campaign | adset | ad — the granularity of the ROWS returned, independent of object_id", example: "campaign"}
        time_increment: {type: string, required: false, note: "1 for a daily series; omit for one aggregate row", example: "1"}
        breakdowns: {type: string, required: false, note: "e.g. age,gender or publisher_platform — not every breakdown combines with every metric", example: "publisher_platform"}
        limit: {type: integer, required: false, example: 100}
      note: "conversions are NOT top-level fields: they arrive inside `actions` as [{action_type, value}] and you pick the action_type that matches the campaign's objective (purchase, lead, link_click). Attribution defaults to the ad account's setting unless action_attribution_windows is passed. A large request answers with a report_run_id for async polling instead of data"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account / platform rate limits apply; wide breakdowns consume the ad account's rate-limit budget fast}
    test_request:
      pathParams: {object_id: "act_1203093248302225"}
      queryParams: {date_preset: "last_7d", limit: 2}
    verified: 2026-07-28
    example_response: examples/meta-ads.insights.json
    docs_url: https://developers.facebook.com/docs/marketing-api/insights

