- id: hunter.x.discover-companies
  tier: extended
  platform: companies
  capability: companies.search
  method: POST
  path: /discover
  name: "Discover companies by criteria or plain-language query"
  summary: Identifies companies matching specified criteria; returns up to 100 companies per request
  input:
    body:
      query:
        type: string
        required: false
        note: natural-language description of the companies to find; either query or at least one filter is required
      headquarters_location:
        type: string
        required: false
      industry:
        type: string
        required: false
      headcount:
        type: string
        required: false
      company_type:
        type: string
        required: false
      technology:
        type: string
        required: false
      limit:
        type: integer
        required: false
        example: 1
      offset:
        type: integer
        required: false
    bodyType: json
    note: 'either query (natural language) or at least one filter parameter is required. Cheap probe: body {query: "B2B SaaS companies in the United States", limit: 1}'
  test_request:
    body:
      query: B2B SaaS companies in the United States
    bodyType: json
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: Discover does not consume search or verification credits
  docs_url: https://hunter.io/api-documentation/v2#discover
  verified: '2026-07-28'
  example_response: examples/hunter.x.discover-companies.json
  observed_time: 2.11
