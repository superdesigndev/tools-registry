  unverified: 'http 404 — WITHDRAWN, not broken. Re-probed 2026-07-31 and still 404, and the tell is
    the response BODY — Hunter answers every real API route with its JSON error envelope
    ({errors:[{id,code,details}]}), and this path returns the site''s HTML 404 page instead, meaning
    the router has no such API route at all. /leads/custom_attributes is not the relocation either
    (it parses as /leads/{id} and answers "This lead does not exist"). The whole custom-attributes
    family below is kept only because Hunter''s help article still documents it; treat all four as
    retired until Hunter republishes a working path.'
