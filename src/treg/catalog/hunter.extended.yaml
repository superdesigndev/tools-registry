- id: hunter.x.multi-domain-search
  tier: extended
  platform: people
  method: POST
  path: /multi-domain-search
  name: Search emails across multiple companies
  summary: Searches across multiple companies at once; returns masked results with reveal handles
  input:
    body:
      companies:
        type: array
        required: true
        note: list of {domain} or {company} objects to search
      type:
        type: string
        required: false
        note: 'personal | generic — live-verified required: companies alone gets "Provide at least one filter to search across domains"'
      limit:
        type: integer
        required: false
      per_domain:
        type: integer
        required: false
    bodyType: json
    note: results are masked; addresses are unlocked via hunter.x.multi-domain-search-reveal
  test_request:
    body:
      companies:
      - domain: stripe.com
      type: personal
    bodyType: json
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: searching is free; credits are charged only on reveal
  docs_url: https://hunter.io/api-documentation/v2#multi-domain-search
  verified: '2026-07-28'
  example_response: examples/hunter.x.multi-domain-search.json
  observed_time: 1.08
  capability: people.search
- id: hunter.x.multi-domain-search-reveal
  tier: extended
  platform: people
  method: POST
  path: /multi-domain-search/reveal
  name: Reveal emails from a multi-domain search
  summary: Unlocks the email addresses behind the handles returned by Multi-Domain Search
  input:
    body:
      handles:
        type: array
        required: true
        note: array of opaque handles from a prior multi-domain-search response, max 100 per request
    bodyType: json
  untestable: handles are opaque ids minted by a prior multi-domain-search call; none exist without one
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://hunter.io/pricing
    checked: '2026-07-28'
    confidence: documented
    note: 1 SEARCH credit per personal email revealed; 1 credit per domain for generic emails
  docs_url: https://hunter.io/api-documentation/v2#multi-domain-search
  capability: people.enrich
