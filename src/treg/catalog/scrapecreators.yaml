    capability: instagram.post.comments
    platform: instagram
    scope: any_account
    method: GET
    path: /v2/instagram/post/comments
    name: "Instagram post or reel comments by URL"
    summary: "Retrieves comments on a public Instagram post or reel."
    input:
      queryParams:
        url: {type: string, required: true, note: "The URL of the post or reel to get comments from", example: "https://www.instagram.com/reel/DOq6eV6iIgD"}
        cursor: {type: string, required: false, note: "The cursor to get more comments. Get 'cursor' from previous response."}
    test_request:
      queryParams: {url: "https://www.instagram.com/reel/DOq6eV6iIgD"}
    cost: {type: per_call, value: 1, currency: credit, per: 1, unit: call, source: rate_card_api, source_url: 'https://docs.scrapecreators.com/openapi.json', checked: '2026-07-28', confidence: verified}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.instagram.post.comments.json
    docs_url: https://docs.scrapecreators.com/instagram/post/comments

