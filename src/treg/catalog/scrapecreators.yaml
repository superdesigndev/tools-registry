provider: scrapecreators
source:
  docs: https://docs.scrapecreators.com
  openapi: https://docs.scrapecreators.com/openapi.json
  curated: '2026-07-28'
limits: "billed per credit, 100 free credits on signup"
pricing_url: https://scrapecreators.com/pricing

endpoints:
  # --- Account ------------------------------------------------------------------------------
  - id: scrapecreators.account.usage
    kind: account
    capability: account.usage
    platform: account
    scope: any_account
    method: GET
    path: /v1/account/credit-balance
    name: "Check credit balance"
    summary: "Returns the number of API credits remaining on your Scrape Creators account."
    input:
      queryParams: {}
    test_request:
      queryParams: {}
    cost: {type: free, value: 0, currency: USD, unit: call}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.account.usage.json
    docs_url: https://docs.scrapecreators.com/account/credit-balance

  # --- TikTok ---------------------------------------------------------------------------------
  - id: scrapecreators.tiktok.user.profile
    capability: tiktok.user.profile
    platform: tiktok
    scope: any_account
    method: GET
    path: /v1/tiktok/profile
    name: "TikTok user profile by username or id — bio, stats"
    summary: "Fetches public profile data for a TikTok user by their handle or user_id — useful for looking up a creator's identity, bio, and account stats."
    input:
      queryParams:
        handle: {type: string, required: false, note: "TikTok handle. You can pass handle or user_id.", example: "stoolpresidente"}
        user_id: {type: string, required: false, note: "TikTok user id."}
      note: "one of handle | user_id"
    test_request:
      queryParams: {handle: "stoolpresidente"}
    cost: {type: per_call, value: 1, currency: credit, per: 1, unit: call, source: rate_card_api, source_url: 'https://docs.scrapecreators.com/openapi.json', checked: '2026-07-28', confidence: verified}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.tiktok.user.profile.json
    docs_url: https://docs.scrapecreators.com/tiktok/profile

  - id: scrapecreators.tiktok.video.detail
    capability: tiktok.video.detail
    platform: tiktok
    scope: any_account
    method: GET
    path: /v2/tiktok/video
    name: "TikTok video by URL — engagement stats, transcript"
    summary: "Fetches detailed data for a single TikTok video by URL, including its metadata, engagement stats, and optionally its transcript/captions."
    input:
      queryParams:
        url: {type: string, required: true, note: "TikTok video URL", example: "https://www.tiktok.com/@randomspamvideos25/video/7251387037834595630"}
        get_transcript: {type: boolean, required: false, note: "Get transcript of the video"}
    test_request:
      queryParams: {url: "https://www.tiktok.com/@randomspamvideos25/video/7251387037834595630"}
    cost: {type: per_call, value: 1, currency: credit, per: 1, unit: call, source: rate_card_api, source_url: 'https://docs.scrapecreators.com/openapi.json', checked: '2026-07-28', confidence: verified}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.tiktok.video.detail.json
    docs_url: https://docs.scrapecreators.com/tiktok/video

  - id: scrapecreators.tiktok.video.comments
    capability: tiktok.video.comments
    platform: tiktok
    scope: any_account
    method: GET
    path: /v1/tiktok/video/comments
    name: "TikTok video comments by URL — replies, engagement"
    summary: "Fetches comments on a TikTok video by URL — useful for reading audience reactions, replies, and engagement."
    input:
      queryParams:
        url: {type: string, required: true, note: "TikTok video URL", example: "https://www.tiktok.com/@randomspamvideos25/video/7251387037834595630"}
        cursor: {type: number, required: false, note: "Cursor to get more comments. Get 'cursor' from previous response.", example: 20}
    test_request:
      queryParams: {url: "https://www.tiktok.com/@randomspamvideos25/video/7251387037834595630"}
    cost: {type: per_call, value: 1, currency: credit, per: 1, unit: call, source: rate_card_api, source_url: 'https://docs.scrapecreators.com/openapi.json', checked: '2026-07-28', confidence: verified}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.tiktok.video.comments.json
    docs_url: https://docs.scrapecreators.com/tiktok/video/comments

  - id: scrapecreators.tiktok.search.videos
    capability: tiktok.search.videos
    platform: tiktok
    scope: any_account
    method: GET
    path: /v1/tiktok/search/keyword
    name: "Search TikTok videos by keyword"
    summary: "Searches for TikTok videos by keyword or phrase — the general video search across all of TikTok."
    input:
      queryParams:
        query: {type: string, required: true, note: "Keyword to search for", example: "ai"}
        date_posted: {type: string, required: false, note: "Time frame", example: "all-time"}
    test_request:
      queryParams: {query: "ai", date_posted: "all-time"}
    cost: {type: per_call, value: 1, currency: credit, per: 1, unit: call, source: rate_card_api, source_url: 'https://docs.scrapecreators.com/openapi.json', checked: '2026-07-28', confidence: verified}
    verified: '2026-07-28'
    example_response: examples/scrapecreators.tiktok.search.videos.json
    docs_url: https://docs.scrapecreators.com/tiktok/search/keyword

