# unverified — endpoints require a connected OAuth account; verify via a treg connection later.
#
# ⚠️ THREE HOSTS, ONE PROVIDER. Google split the old My Business API into per-concern services and
# never unified them, so the paths below do NOT all hang off this provider's base_url
# (https://mybusinessaccountmanagement.googleapis.com). Each endpoint states its host in
# `input.note`; the account endpoint is the only one that is genuinely relative to base_url:
#   accounts            → mybusinessaccountmanagement.googleapis.com   (base_url ✓)
#   locations           → mybusinessbusinessinformation.googleapis.com
#   reviews + replies   → mybusiness.googleapis.com  (the legacy v4 API — reviews were never
#                         migrated, so v4 is not deprecated-in-practice for this one job)
# Callers going through treg's provisioned tool must override the host for the last two.
#
# Scope granted: business.manage — one scope covering read AND write (there is no read-only
# variant), which is why replying to a review needs no extra consent. The real gate is not the
# scope but Google's separate Business Profile API access request: every Cloud project starts at
# ZERO quota, so an unapproved project gets HTTP 429 on the very first call with a perfectly valid
# token. That is an approval state, not a credential problem, and reconnecting will not fix it.
provider: google-business-profile
source:
  docs: https://developers.google.com/my-business
  openapi: https://mybusinessaccountmanagement.googleapis.com/$discovery/rest?version=v1
  curated: 2026-07-28

limits: "default project quota is low and must be raised by request"
pricing_url: https://developers.google.com/my-business/content/limits
endpoints:
  - id: google-business-profile.accounts
    capability: google-business.accounts
    platform: google-business
    scope: own_account
    method: GET
    path: /v1/accounts
    name: "List your Business Profile accounts"
    summary: "List the Google Business Profile accounts you manage"
    input:
      queryParams:
        pageSize: {type: integer, required: false, note: "max 20", example: 20}
        pageToken: {type: string, required: false}
        filter: {type: string, required: false, note: "e.g. type=PERSONAL or type=LOCATION_GROUP"}
      note: "host: mybusinessaccountmanagement.googleapis.com (this provider's base_url). Returns {accounts: [{name: \"accounts/123…\", accountName, type, role}]}; `name` is the account resource id every other endpoint needs. This is also the connection's health probe and resource picker"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'included with the connected account; the Business Profile API is quota-gated per project (default zero until Google approves the access request), no per-call charge'}
    docs_url: https://developers.google.com/my-business/reference/accountmanagement/rest/v1/accounts/list

  - id: google-business-profile.locations
    capability: google-business.locations
    platform: google-business
    scope: own_account
    method: GET
    path: /v1/accounts/{account_id}/locations
    name: "List your business listings — address, hours, category"
    summary: "List your business's listings with their addresses, hours and categories"
    input:
      pathParams:
        account_id: {type: string, required: true, note: "the digits from the account resource name (accounts/123456789)", example: "123456789"}
      queryParams:
        readMask: {type: string, required: true, note: "MANDATORY comma-separated field list — the call fails without it", example: "name,title,storefrontAddress,phoneNumbers,websiteUri,regularHours,categories,metadata"}
        pageSize: {type: integer, required: false, note: "max 100", example: 100}
        pageToken: {type: string, required: false}
        filter: {type: string, required: false, note: "e.g. title=\"Main Street Cafe\""}
      note: "HOST OVERRIDE: mybusinessbusinessinformation.googleapis.com, NOT this provider's base_url. `name` comes back as locations/{location_id} — that id plus the account id is what the reviews endpoint needs. metadata.mapsUri / newReviewUri are only returned if asked for in readMask"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account / platform quotas apply}
    docs_url: https://developers.google.com/my-business/reference/businessinformation/rest/v1/accounts.locations/list

  - id: google-business-profile.reviews
    capability: google-business.reviews
    platform: google-business
    scope: own_account
    method: GET
    path: /v4/accounts/{account_id}/locations/{location_id}/reviews
    name: "List customer reviews on your business listing"
    summary: "Read the reviews customers left on your Google Business Profile listing"
    input:
      pathParams:
        account_id: {type: string, required: true, example: "123456789"}
        location_id: {type: string, required: true, note: "digits from the location resource name (locations/987654321)", example: "987654321"}
      queryParams:
        pageSize: {type: integer, required: false, note: "max 50", example: 50}
        pageToken: {type: string, required: false}
        orderBy: {type: string, required: false, note: "updateTime desc | rating | rating desc", example: "updateTime desc"}
      note: "HOST OVERRIDE: mybusiness.googleapis.com — reviews are the one job never migrated off the legacy v4 API, so v4 here is correct rather than stale. Response carries averageRating and totalReviewCount alongside reviews[]; starRating is the WORD (\"FIVE\"), not a number, and a review already answered carries a reviewReply object"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account / platform quotas apply}
    docs_url: https://developers.google.com/my-business/reference/rest/v4/accounts.locations.reviews/list

  - id: google-business-profile.review.reply
    kind: action
    capability: google-business.review.reply
    platform: google-business
    scope: own_account
    method: PUT
    path: /v4/accounts/{account_id}/locations/{location_id}/reviews/{review_id}/reply
    name: "Reply to a customer review as the business"
    summary: "Reply publicly to a customer review as the business"
    input:
      pathParams:
        account_id: {type: string, required: true, example: "123456789"}
        location_id: {type: string, required: true, example: "987654321"}
        review_id: {type: string, required: true, note: "reviewId from google.business.reviews", example: "AbCdEf123456"}
      body:
        comment: {type: string, required: true, note: "the public reply text, max 4096 characters", example: "Thanks for visiting — glad the flat white landed."}
      bodyType: json
      note: "HOST OVERRIDE: mybusiness.googleapis.com. PUT is an upsert: sending it again REPLACES an existing reply rather than adding a second one. The reply is publicly visible on Google Maps and Search the moment it succeeds, and the reviewer is emailed — confirm before calling"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account / platform quotas apply}
    docs_url: https://developers.google.com/my-business/reference/rest/v4/accounts.locations.reviews/updateReply

