# google-ads — EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries carry no
# capability, no verification and no example response — that is what the core
# google-ads.yaml is for. Routes already curated there are excluded here.
# 
# NOT A ROUTE LIST — A RESOURCE LIST. The Google Ads API publishes no discovery document or
# OpenAPI spec, and it would not help if it did: one endpoint, googleAds:searchStream, answers
# every read, and what actually varies is the GAQL `FROM` clause. So each entry below is one
# QUERYABLE RESOURCE pointed at that single path, capped at the 42 an agent would realistically
# reach for out of ~180 the API defines. `input.note` names the resource and links its field
# reference; `docs_url` goes straight to the selectable fields, segments and metrics.
# 
# API version v25, matching the core file and OAuthProvider.examples. Versions expire on a
# calendar: v21 was sunset 2026-08-05 and every call 400'd with UNSUPPORTED_VERSION until this was
# bumped on 2026-08-17. (A version that never existed 404s as HTML instead.) Bump all four places
# together — see the header of google-ads.yaml.
# 
# Every call needs BOTH the OAuth bearer and a developer-token header from an approved manager
# (MCC) account — see OAuthProvider.extra_credential_note. The adwords scope treg requests
# covers the whole API, so there are no scope gaps here; the gate is the developer token's
# access level (Basic caps the account at 15,000 operations/day).

provider: google-ads
source:
  method: official GAQL resource reference (one entry per queryable resource)
  ingested: '2026-07-28'
  spec_urls:
  - https://developers.google.com/google-ads/api/fields/v25/overview
  - https://developers.google.com/google-ads/api/reference/rpc/v25/overview
endpoints:
- id: google-ads.x.gaql-campaign
  tier: extended
  platform: google-ads
  method: POST
  path: /v25/customers/{customer_id}/googleAds:searchStream
  name: "Google Ads campaign stats via GAQL"
  summary: GAQL FROM campaign — Campaigns — name, status, budget, bidding strategy, start/end dates and all campaign-level metrics
  scope: own_account
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: 'no per-call charge; counts against the developer token''s daily operation limit (Basic access: 15,000 operations/day)'
  input:
    pathParams:
      customer_id:
        type: string
        required: true
        note: the 10-digit Google Ads customer id, no dashes; from listAccessibleCustomers
    bodyType: json
    body:
      type: object
      required: true
      note: '{"query": "SELECT <fields> FROM campaign WHERE segments.date DURING LAST_30_DAYS"}'
    note: 'Resource: campaign. Its selectable fields, segments and metrics are listed at https://developers.google.com/google-ads/api/fields/v25/campaign. searchStream returns the whole result set in one streamed response and takes no page size; googleAds:search is the paginated twin (curated in the core file).'
