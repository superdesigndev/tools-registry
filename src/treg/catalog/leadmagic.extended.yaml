    tier: extended
    platform: people
    method: POST
    path: /v1/people/b2b-profile
    name: "Reverse email lookup — the person's profile URL"
    summary: "Performs reverse email lookup to identify professional profile URLs associated with work or personal email addresses"
    input:
      bodyType: json
      body:
        work_email: {type: string, required: false, example: "jane@leadmagic.io"}
        personal_email: {type: string, required: false}
      note: "at least one of work_email | personal_email is required"
    test_request:
      bodyType: json
      body: {work_email: "press@leadmagic.io"}
    cost:
      type: per_success
      value: 10
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://leadmagic.io/pricing
      checked: '2026-08-16'
      confidence: verified
      note: "VERIFIED live 2026-08-16 by LeadMagic's own echo: a hit answered credits_consumed: 10 (charged $0.25 exactly), a miss credits_consumed: 0 (charged $0). The 'b2b overstatement' suspicion from the August sweep was checked and REFUTED for this endpoint — the over-billing it was blamed for was the settle bug fixed in d458ee5"
    verified: 2026-07-28
    example_response: examples/leadmagic.x.b2b-profile.json
    docs_url: https://leadmagic.io/docs/api-reference/email-to-profile
    capability: people.identity.resolve

