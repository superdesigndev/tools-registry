  - id: leadmagic.x.jobs-search-v3
    domain: companies
    tier: extended
    platform: companies
    method: POST
    path: /v3/jobs/search
    name: "Search job postings — titles, companies, hiring signals"
    summary: "Discovers open job postings with hiring signal data including titles, companies, locations, tags, and occupation taxonomy — resolves company domains, country codes, tags and occupation values into normalized filter IDs before executing a bounded query. Searches job postings, not people"
    input:
      bodyType: json
      body:
        titles.include: {type: "array[string]", required: false, example: ["Software Engineer"]}
        companies.include: {type: "array[string]", required: false, note: "company domains", example: ["leadmagic.io"]}
        location.countries: {type: "array[string]", required: false, example: ["US"]}
        seniority: {type: "array[string]", required: false}
        hasRemote: {type: boolean, required: false}
        postedWithin: {type: integer, required: false, note: "days", example: 30}
        limit: {type: integer, required: false, example: 1}
        cursor: {type: string, required: false, note: "opaque pagination token"}
        dryRun: {type: boolean, required: false}
      note: "every field is optional; an empty body queries the whole index — always set limit deliberately"
    test_request:
      bodyType: json
      body: {companies: {include: ["leadmagic.io"]}, limit: 1}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
