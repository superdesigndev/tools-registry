        page: {type: integer, required: false, note: "1-based", example: 1}
        searchId: {type: string, required: false, note: "data.api_info.search_id from the previous page — required for stable paging"}
        sessionId: {type: string, required: false, note: "data.api_info.session_id from the previous page"}
        sortType: {type: string, required: false, note: "general (default) | popularity_descending | time_descending"}
        noteType: {type: string, required: false, note: "ALL (default) | VIDEO_NOTE | NORMAL_NOTE"}
        timeFilter: {type: string, required: false, note: "ALL (default) | ONE_DAY | ONE_WEEK | HALF_YEAR"}
    test_request:
      queryParams: {keyword: "咖啡", page: 1}
    cost: {type: per_success, value: 0.2, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
