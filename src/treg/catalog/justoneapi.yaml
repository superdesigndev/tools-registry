provider: justoneapi
source:
  docs: https://docs.justoneapi.com/en/usage
  openapi: null   # no single spec; each doc page links a per-endpoint OpenAPI JSON
  curated: 2026-07-28

# Jobs the shared taxonomy does not cover yet — reviewer merges these into capabilities.yaml.
# Auth note: the API token rides as `?token=…` and is INJECTED by treg — never list it as user input.
# Response convention: HTTP 200 always; the business result is `code` (0 = success, and only a
# code-0 response is billed). Hence every endpoint expects code == 0.
pricing_url: https://www.justoneapi.com/
endpoints:
  - id: justoneapi.tiktok.user.profile
    capability: tiktok.user.profile
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/tiktok/get-user-detail/v1
    name: "TikTok user profile by username or user id"
    summary: "Public TikTok profile by username (uniqueId) or secUid"
    input:
      queryParams:
        uniqueId: {type: string, required: false, note: "public handle from the profile URL", example: "tiktok"}
        secUid: {type: string, required: false, note: "opaque user id; use when the handle is unknown"}
      note: "one of uniqueId | secUid; uniqueId preferred. secUid in the response is the key needed by tiktok.user.videos."
    test_request:
      queryParams: {uniqueId: "tiktok"}
    cost: {type: per_success, value: 0.1, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
    verified: 2026-07-28
    example_response: examples/justoneapi.tiktok.user.profile.json
    docs_url: https://docs.justoneapi.com/en/api/tiktok/user-profile-v1

  - id: justoneapi.tiktok.user.videos
    capability: tiktok.user.videos
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/tiktok/get-user-post/v1
    name: "TikTok user posts by user id"
    summary: "Posts published by a TikTok user, by secUid, cursor-paginated"
    input:
      queryParams:
        secUid: {type: string, required: true, note: "opaque user id; get it from tiktok.user.profile"}
        cursor: {type: string, required: false, note: "'0' for the first page, then max_cursor from the previous response", example: "0"}
        sort: {type: string, required: false, note: "LATEST (default) | MOST_POPULAR", example: "LATEST"}
    test_request:
      queryParams: {secUid: "MS4wLjABAAAAv7iSuuXDJGDvJkmH_vz1qkDZYo1apxgzaxdBSeIuPiM", cursor: "0"}
    cost: {type: per_success, value: 0.1, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
    verified: 2026-07-28
    example_response: examples/justoneapi.tiktok.user.videos.json
    docs_url: https://docs.justoneapi.com/en/api/tiktok/user-published-posts-v1

  - id: justoneapi.tiktok.video.detail
    capability: tiktok.video.detail
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/tiktok/get-post-detail/v1
    name: "TikTok post details by post id — metadata, stats"
    summary: "A single TikTok post's metadata and stats by post id"
    input:
      queryParams:
        postId: {type: string, required: true, note: "numeric id from the video URL (/video/<postId>)", example: "7666214645006421278"}
    test_request:
      queryParams: {postId: "7666214645006421278"}
    cost: {type: per_success, value: 0.1, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
    verified: 2026-07-28
    example_response: examples/justoneapi.tiktok.video.detail.json
    docs_url: https://docs.justoneapi.com/en/api/tiktok/post-details-v1

  - id: justoneapi.tiktok.video.comments
    capability: tiktok.video.comments
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/tiktok/get-post-comment/v1
    name: "TikTok post comments by post id"
    summary: "Comments on a TikTok post, cursor-paginated"
    input:
      queryParams:
        awemeId: {type: string, required: true, note: "the post id (same numeric id as the video URL)", example: "7666214645006421278"}
        cursor: {type: string, required: false, note: "start at '0'", example: "0"}
      note: "page size is fixed by the provider; only the cursor advances"
    test_request:
      queryParams: {awemeId: "7666214645006421278", cursor: "0"}
    cost: {type: per_success, value: 0.1, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
    verified: 2026-07-28
    example_response: examples/justoneapi.tiktok.video.comments.json
    docs_url: https://docs.justoneapi.com/en/api/tiktok/post-comments-v1

  - id: justoneapi.tiktok.search.videos
    capability: tiktok.search.videos
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/tiktok/search-post/v1
    name: "Search TikTok posts by keyword"
    summary: "Search TikTok posts by keyword, with region, sort and publish-time filters"
    input:
      queryParams:
        keyword: {type: string, required: true, example: "coffee"}
        offset: {type: integer, required: false, note: "starts at 0, steps by 20", example: 0}
        sortType: {type: string, required: false, note: "RELEVANCE (default) | MOST_LIKED"}
        publishTime: {type: string, required: false, note: "ALL (default) | ONE_DAY | ONE_WEEK | ONE_MONTH | THREE_MONTH | SIX_MONTH"}
        region: {type: string, required: false, note: "ISO 3166-1 alpha-2, default US", example: "US"}
    test_request:
      queryParams: {keyword: "coffee", offset: 0, region: "US"}
    cost: {type: per_success, value: 0.1, currency: CNY, per: 1, unit: call, source: rate_card_api, source_url: 'https://www.justoneapi.com/', checked: '2026-07-28', confidence: documented, note: billed only on success (code 0); errors free — dashboard price export 2026-07-28}
    expect: {json_path: code, equals: 0}
    verified: 2026-07-28
    example_response: examples/justoneapi.tiktok.search.videos.json
    docs_url: https://docs.justoneapi.com/en/api/tiktok/post-search-v1

  - id: justoneapi.xiaohongshu.search.notes
