    method: GET
    path: /api/v1/tiktok/app/v3/fetch_video_search_result
    summary: "Search TikTok videos by keyword"
    name: "Search TikTok videos by keyword"
    # The documented web-family equivalent (/api/v1/tiktok/web/fetch_search_video) returned HTTP 400
    # on every attempt on 2026-07-28 regardless of parameters; the app/v3 route works and costs the same.
    input:
      queryParams:
        keyword: {type: string, required: true, example: "coffee"}
        count: {type: integer, required: false, note: "items per page (default 20)", example: 5}
        offset: {type: integer, required: false, example: 0}
        sort_type: {type: integer, required: false, note: "0 relevance (default), 1 most liked, 2 newest"}
        publish_time: {type: integer, required: false, note: "0 all time (default); other values narrow the publish window"}
        region: {type: string, required: false, note: "region code; default US"}
    test_request:
      queryParams: {keyword: "coffee", count: 5}
    cost: {type: per_success, value: 0.001, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.tikhub.io/api/v1/tikhub/user/get_all_endpoints_info', checked: '2026-07-28', confidence: verified}
    verified: 2026-07-28
    example_response: examples/tikhub.tiktok.search.videos.json
    docs_url: https://docs.tikhub.io/

