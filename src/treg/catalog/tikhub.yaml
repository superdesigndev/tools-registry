provider: tikhub
source:
  docs: https://docs.tikhub.io/
  openapi: https://api.tikhub.io/openapi.json
  curated: 2026-07-28
# Per-endpoint prices below are not guesses: TikHub publishes them through its own
# GET /api/v1/tikhub/user/get_all_endpoints_info (free, 0-cost endpoint), which returns
# {endpoint_uri, endpoint_cost, rate_limit} for every route. Values captured 2026-07-28.
# Every listed endpoint is rate-limited to 10 requests/second.

# The rate card IS an endpoint here, so that is what `pricing_url` points at rather than a marketing
# page: it is machine-readable, free to call, and re-checkable, which is what earns every price in
# this file `confidence: verified`.
pricing_url: https://api.tikhub.io/api/v1/tikhub/user/get_all_endpoints_info

endpoints:
  # --- TikTok -----------------------------------------------------------------------------------
  - id: tikhub.tiktok.user.profile
    capability: tiktok.user.profile
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/v1/tiktok/web/fetch_user_profile
    summary: "Public TikTok profile by username (uniqueId) or secUid"
    name: "TikTok user profile by username or secUid"
    input:
      queryParams:
        uniqueId: {type: string, required: false, note: "username from the profile URL", example: "tiktok"}
        secUid: {type: string, required: false}
      note: "one of uniqueId | secUid; uniqueId preferred"
    test_request:
      queryParams: {uniqueId: "tiktok"}
    cost: {type: per_success, value: 0.001, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.tikhub.io/api/v1/tikhub/user/get_all_endpoints_info', checked: '2026-07-28', confidence: verified, note: charged on 2xx only}
    verified: 2026-07-28
    example_response: examples/tikhub.tiktok.user.profile.json
    docs_url: https://docs.tikhub.io/

  - id: tikhub.tiktok.user.videos
    # UNVERIFIED (2026-07-28): succeeded once, then failed 11 consecutive times with
    #   HTTP 400 {"detail":{"code":400,"message":"Request failed. Please retry. …"}}
    # across curl and httpx, with and without the optional params, spaced out to rule out the
    # 10 req/s limit. The single success proves the path and params below are correct, so this is
    # TikHub's upstream breaking, not a spec error. The app/v3 alternative
    # (/api/v1/tiktok/app/v3/fetch_user_post_videos) answers HTTP 402 — it is not free-credit
    # eligible — so there is no working route for this capability on the current account.
    capability: tiktok.user.videos
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/v1/tiktok/web/fetch_user_post
    name: "TikTok user's recent videos by secUid"
    summary: "Recent videos posted by a TikTok user (keyed by secUid, not username)"
    input:
      queryParams:
        secUid: {type: string, required: true, note: "user secUid — obtain it from tiktok.user.profile first; this endpoint does NOT accept a username", example: "MS4wLjABAAAAv7iSuuXDJGDvJkmH_vz1qkDZYo1apxgzaxdBSeIuPiM"}
        cursor: {type: integer, required: false, note: "page cursor", example: 0}
        count: {type: integer, required: false, note: "items per page (default 20)", example: 5}
        coverFormat: {type: integer, required: false, note: "cover image format (default 2)"}
        post_item_list_request_type: {type: integer, required: false, note: "sort type (default 0)"}
    test_request:
      queryParams: {secUid: "MS4wLjABAAAAv7iSuuXDJGDvJkmH_vz1qkDZYo1apxgzaxdBSeIuPiM", count: 5}
    cost: {type: per_success, value: 0.001, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.tikhub.io/api/v1/tikhub/user/get_all_endpoints_info', checked: '2026-07-28', confidence: verified}
    docs_url: https://docs.tikhub.io/

  - id: tikhub.tiktok.video.detail
    capability: tiktok.video.detail
    platform: tiktok
    scope: any_account
    method: GET
    path: /api/v1/tiktok/web/fetch_post_detail
    name: "TikTok video details by video id — author, stats"
    summary: "A single TikTok video's metadata, author and stats"
    input:
      queryParams:
        itemId: {type: string, required: true, note: "numeric video id (aweme id) from the video URL", example: "7231337071831321903"}
        region: {type: string, required: false, note: "region code affecting content region; default US", example: "US"}
    test_request:
      queryParams: {itemId: "7606449212716305678"}
    cost: {type: per_success, value: 0.001, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.tikhub.io/api/v1/tikhub/user/get_all_endpoints_info', checked: '2026-07-28', confidence: verified}
    verified: 2026-07-28
    example_response: examples/tikhub.tiktok.video.detail.json
    docs_url: https://docs.tikhub.io/

