- id: serpapi.x.google-maps
  tier: extended
  platform: google
  method: GET
  path: /search
  name: "Google Maps place results for a query — rating, address"
  summary: Live Google Maps place results for a keyword and location — position, place_id, rating, address, phone, website
  input:
    queryParams:
      engine:
        type: string
        required: true
        example: google_maps
      type:
        type: string
        required: true
        note: search (keyword search) or place (single place lookup)
        example: search
      q:
        type: string
        required: true
        note: search keyword
        example: pizza
      ll:
        type: string
        required: false
        note: '@latitude,longitude,zoom — alternative to location+z or lat/lon+z'
        example: '@40.7455096,-74.0083012,14z'
      start:
        type: integer
        required: false
        note: pagination offset, increments of 20
        example: 0
    note: answers arrive in `local_results`.
  cost:
    type: per_success
    value: 0.015
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://serpapi.com/pricing
    checked: '2026-07-28'
    confidence: documented
    note: 1 search, entry-level Developer plan rate
  test_request:
    queryParams:
      engine: google_maps
      type: search
      q: pizza
      ll: '@40.7455096,-74.0083012,14z'
  docs_url: https://serpapi.com/google-maps-api
  verified: '2026-07-28'
  example_response: examples/serpapi.x.google-maps.json
  observed_time: 1.95
