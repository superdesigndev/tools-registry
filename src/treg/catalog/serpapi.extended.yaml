- id: serpapi.x.google-trends
  tier: extended
  platform: google
  method: GET
  path: /search
  name: "Google Trends interest over time for search terms"
  summary: Interest-over-time, regional breakdown, related topics or related queries for up to 5 comma-separated terms
  input:
    queryParams:
      engine:
        type: string
        required: true
        example: google_trends
      q:
        type: string
        required: true
        note: up to 5 comma-separated terms
        example: coffee,milk
      data_type:
        type: string
        required: false
        note: TIMESERIES (default) | GEO_MAP | GEO_MAP_0 | RELATED_TOPICS | RELATED_QUERIES
        example: TIMESERIES
      geo:
        type: string
        required: false
        note: region code; default Worldwide
        example: US
      date:
        type: string
        required: false
        note: e.g. "today 12-m", "now 7-d"
        example: today 12-m
    note: 'result key depends on data_type: interest_over_time / compared_breakdown_by_region / interest_by_region / related_topics / related_queries.'
  cost:
    type: per_success
    value: 0.015
    currency: USD
    per: 1
    unit: call
    source: docs
    source_url: https://serpapi.com/pricing
    checked: '2026-07-28'
    confidence: documented
  test_request:
    queryParams:
      engine: google_trends
      q: coffee
      data_type: TIMESERIES
      geo: US
  docs_url: https://serpapi.com/google-trends-api
  verified: '2026-07-28'
  example_response: examples/serpapi.x.google-trends.json
  observed_time: 7.14
