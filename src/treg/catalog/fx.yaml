# Proprietary METERING units -> USD, for providers that bill in something that is neither a currency
# nor a credit. Same rule as credits, one level deeper: a meter is scoped to its provider AND to
# itself. Majestic carries three allowances that do not convert into each other, so it gets three
# rows; a cost block names the meter it spends in `cost.unit` and `catalog_store.cost_view` looks it
# up here. `usd: null` is the honest state for a meter that comes bundled with a plan at no
# published per-unit price -- those endpoints keep `cost.usd = null` and display natively
# ("5,000 analysis units/call"), which is also what refuses them a platform key.
# Filling one of these in requires a PUBLISHED plan price and a PUBLISHED unit allowance to divide
# it by. Researched 2026-07-31: three of the four are now derivable from the provider's own plan
# pages (rate = cheapest API-enabled plan / its included allowance -- a per-unit UPPER BOUND, since
# bigger plans are cheaper per unit). Semrush remains null: package sizes are published, prices are
# sales-gated. Majestic's three pools share ONE subscription price, so each pool's rate divides the
# WHOLE subscription by that pool's allowance -- an upper bound per pool; never sum pools per call.
unit_rates_usd:
  semrush:
    api_unit: {usd: null, basis: "units are pre-purchased in packages (2M / 5M / 10M / 20M) whose prices Semrush does not list publicly; every route says contact sales", source: "https://developer.semrush.com/api/get-started/api-access/", checked: "2026-07-31"}
  majestic:
    analysis_unit: {usd: 0.0000040, basis: "API plan $399.99/mo includes 100M analysis units; 399.99/100,000,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
    retrieval_unit: {usd: 0.0000200, basis: "same $399.99 plan includes 20M retrieval units; 399.99/20,000,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
    index_item_unit: {usd: 0.00080, basis: "same $399.99 plan includes 500K index item units; 399.99/500,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
  moz:
    quota_row: {usd: 0.006667, basis: "Links API Starter $20/mo for 3,000 rows; 20/3,000 (upper bound -- the $75/15,000 tier and the published $5/1,000 overage both work out to $0.005/row)", source: "https://moz.com/products/api/pricing", checked: "2026-07-31"}
  findymail:
    verifier_credit: {usd: null, basis: "the Starter plan grants 5,000 verifier credits as a BONUS alongside its 5,000 finder credits, with no standalone price and no verifier-only plan, so no per-verification dollar figure can be derived honestly. POST /verify therefore displays natively ('1 verifier credit') and is not platform-eligible until Findymail publishes a verifier price", source: "https://www.findymail.com/pricing", checked: "2026-08-20"}
