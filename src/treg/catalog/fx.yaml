# FX rates for unified-USD display of catalog costs. Source of truth for a cost stays in the
# provider's BILLING currency (that is what the provider charges and what stays correct); the
# server converts to USD at serve time with these rates, so a rate refresh instantly re-prices
# every displayed cost without touching provider files.
# Refresh: `uv run python scripts/catalog_fx_update.py` (open.er-api.com, free, no key).
#
# Credit -> USD rates for endpoints priced in provider credits. A "credit" is a
# PROVIDER-SCOPED unit, never a currency: one scrapecreators credit and one lusha credit
# have nothing to do with each other, so each service gets its own rate. Each rate is the
# cheapest PUBLICLY listed entry tier (plan price / credits included) unless the basis says
# otherwise -- real spend on a bigger tier is lower, so these are upper bounds. `usd: null`
# means the provider publishes no per-credit price (seat-based, negotiated, or not credit
# priced at all); those endpoints display credits instead of dollars, never a guessed USD.
# Hand-maintained: re-check the source URLs periodically and bump `checked`.
#
# `kind: treg_shared_plan` marks a rate TREG SET, not one the vendor published. It exists for
# flat-fee providers (a monthly subscription with a rate limit or unlimited calls), where no
# per-call vendor price can exist. The full pricing ladder, the honesty rules and the monthly
# review live in docs/SHARED-PLAN-PRICING-PLAN.md; the short form:
#   real credits -> divide (the normal entries above). monthly request cap -> fee / cap, also a
#   normal entry. rate limit only -> fee / theoretical max is the FLOOR, the rate sits above it
#   at a stated break-even. unlimited -> a treg rate with the break-even printed.
# A shared-plan entry MUST: have a non-null usd, start its basis with "treg shared-plan rate"
# (the basis travels to every surface that shows provenance, so its first words say whose price
# this is), name the vendor fee ($X/mo), and name "break-even at N calls/mo". The validator and
# tests/test_catalog_api.py enforce all four. Reviewed monthly against audited volume; the price
# is edited BY HAND from the reconcile recovery report, never auto-adjusted.
# NOTE: this block must stay ABOVE `rates_to_usd:` -- catalog_fx_update.py rewrites the file
# from the text before that key, so anything below it is discarded on the next FX refresh.
credit_rates_usd:
  scrapecreators: {usd: 0.00188, basis: "Freelance pay-as-you-go $47 / 25,000 credits (Business tier is $497 / 500,000 = $0.000994)", source: "https://scrapecreators.com/", checked: "2026-07-28"}
  leadmagic: {usd: 0.025, basis: "Basic $49.99/mo / 2,000 credits per month (annual billing $490/yr / 24,000 = $0.0204)", source: "https://leadmagic.io/pricing", checked: "2026-07-28"}
  hunter: {usd: 0.0245, basis: "Starter $49/mo / 2,000 credits; one shared pool -- a search costs 1 credit, a verification 0.5 credit, so verification effectively $0.0123", source: "https://hunter.io/pricing", checked: "2026-07-28"}
  diffbot: {usd: 0.001196, basis: "Startup $299/mo / 250,000 credits", source: "https://www.diffbot.com/pricing/", checked: "2026-07-28"}
  lusha: {usd: 0.1248, basis: "Starter $49.90/mo / 400 credits (email reveal = 1 credit, phone reveal = 10). GET /v3/account/usage returns a free pricing object of per-action credit COUNTS, not dollars -- multiply those counts by this rate", source: "https://www.lusha.com/pricing/", checked: "2026-07-28"}
  akta: {usd: 0.05, basis: "pay-as-you-go $0.05/credit as stated in docs ($0.04 on subscription)", source: "https://docs.akta.pro/getting-started/pricing", checked: "2026-07-28"}
  coresignal: {usd: 0.0196, basis: "Mini $49/mo / 2,500 credits (Growth tier is listed at $0.007/credit)", source: "https://coresignal.com/pricing/", checked: "2026-07-28"}
  thecompaniesapi: {usd: 0.0019, basis: "Startup $95/mo / 50,000 credits (overage listed at $2.50 per 1,000 = $0.0025)", source: "https://www.thecompaniesapi.com/pricing", checked: "2026-07-28"}
  pdl: {usd: 0.38, basis: "our own subscription's checkout quote: Person Enrichment API, 350 credits/mo monthly = $133.00 -> $0.38/credit ($0.280 base + $0.10 for all six premium field bundles, which our platform key serves). Plan-specific, not public: bigger slider tiers and annual (-20%) are cheaper, so this is the upper bound for our plan as configured", note: "no public rate card exists (plans are sales-negotiated); rate read from the account's own checkout on 2026-08-07 and consistent with third-party write-ups citing ~$0.28/match base", source: "PDL dashboard checkout quote (account jason@superdesign.dev)", checked: "2026-08-07"}
  apollo: {usd: 0.026, basis: "Basic $65/seat/mo billed monthly / 2,500 credits per seat per month granted upfront", note: "policy decision 2026-08-13: bill at the Basic-plan rate even though plans are seat-priced and bundle separate email/export/mobile quotas -- the entry-tier plan-price / credits-included convention every other row here uses. Credits do NOT roll over", source: "https://www.apollo.io/pricing", checked: "2026-08-13"}
  crunchbase: {usd: null, basis: "no published API pricing", note: "the Basic API was retired and remaining API access is quoted by sales; no credit unit is published", source: "https://data.crunchbase.com/docs/crunchbase-basic-getting-started", checked: "2026-07-28"}
  brightdata: {usd: null, basis: "not credit-priced", note: "billing is per record / per GB / per 1,000 results per product, with no cross-product credit unit, so costs stay in the provider's own units", source: "https://brightdata.com/pricing", checked: "2026-07-28"}
  seranking: {usd: 0.000179, basis: "credits are sold annually: 12M for $2,148/yr on the entry tier = $0.000179/credit (the 120M tier is $10,200/yr = $0.000085)", source: "https://seranking.com/pricing.html", checked: "2026-07-28"}
  serpstat: {usd: 0.00050, basis: "Team plan $100/mo (annual billing) includes 200K API credits/mo; 100/200,000. Monthly billing is $129 -> $0.000645; the 250K/mo export-rows allowance is a SEPARATE pool", source: "https://serpstat.com/page/pricing-plans/", checked: "2026-07-31"}
  alphavantage: {usd: 0.001, kind: treg_shared_plan, fee_usd_month: 49.99, basis: "treg shared-plan rate. Vendor sells flat $49.99/mo at 75 req/min (= 3.24M calls/mo capacity; floor $0.0000154/call); no per-call vendor price exists. Rate set for break-even at 50,000 calls/mo (1.5% utilization); reviewed monthly against audited volume", source: "https://www.alphavantage.co/premium/", checked: "2026-08-14"}

# Proprietary METERING units -> USD, for providers that bill in something that is neither a currency
# nor a credit. Same rule as credits, one level deeper: a meter is scoped to its provider AND to
# itself. Majestic carries three allowances that do not convert into each other, so it gets three
# rows; a cost block names the meter it spends in `cost.unit` and `catalog_store.cost_view` looks it
# up here. `usd: null` is the honest state for a meter that comes bundled with a plan at no
# published per-unit price -- those endpoints keep `cost.usd = null` and display natively
# ("5,000 analysis units/call"), which is also what refuses them a platform key.
# Filling one of these in requires a PUBLISHED plan price and a PUBLISHED unit allowance to divide
# it by. Researched 2026-07-31: three of the four are now derivable from the provider's own plan
# pages (rate = cheapest API-enabled plan / its included allowance -- a per-unit UPPER BOUND, since
# bigger plans are cheaper per unit). Semrush remains null: package sizes are published, prices are
# sales-gated. Majestic's three pools share ONE subscription price, so each pool's rate divides the
# WHOLE subscription by that pool's allowance -- an upper bound per pool; never sum pools per call.
unit_rates_usd:
  semrush:
    api_unit: {usd: null, basis: "units are pre-purchased in packages (2M / 5M / 10M / 20M) whose prices Semrush does not list publicly; every route says contact sales", source: "https://developer.semrush.com/api/get-started/api-access/", checked: "2026-07-31"}
  majestic:
    analysis_unit: {usd: 0.0000040, basis: "API plan $399.99/mo includes 100M analysis units; 399.99/100,000,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
    retrieval_unit: {usd: 0.0000200, basis: "same $399.99 plan includes 20M retrieval units; 399.99/20,000,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
    index_item_unit: {usd: 0.00080, basis: "same $399.99 plan includes 500K index item units; 399.99/500,000 (upper bound; pool shares the one subscription)", source: "https://majestic.com/plans-pricing", checked: "2026-07-31"}
  moz:
    quota_row: {usd: 0.006667, basis: "Links API Starter $20/mo for 3,000 rows; 20/3,000 (upper bound -- the $75/15,000 tier and the published $5/1,000 overage both work out to $0.005/row)", source: "https://moz.com/products/api/pricing", checked: "2026-07-31"}
