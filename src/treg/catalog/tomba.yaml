provider: tomba
source:
  docs: https://docs.tomba.io/api
  openapi: null # none published — /v1/openapi.json 404s and the reference site is a SPA; paths below were enumerated by live probing on 2026-08-20
  curated: '2026-08-20'
# TWO-HEADER AUTH — read this before wiring the provider up.
# Only three routes answer the API key alone (X-Tomba-Key): /v1/usage, /v1/email-format and
# /v1/email-count. EVERY other route below returns HTTP 400 {"errors":{"type":
# "authentication_failed","message":"No user found for the API supplied. ..."}} unless a SECOND
# header, X-Tomba-Secret, rides along. So the registry entry must use the extra_credential_*
# machinery (token_header for the key, extra_credential_header for the secret) — a single-slot
# injection covers only 3 of 23 endpoints. See notes.md.
#
# Billing is a published per-endpoint credit rate card (pricing_url) and it was confirmed against
# Tomba's own /v1/logs, which reports the credits billed for each call: finder/verifier/
# domain-search/linkedin/enrich/similar/phone-validator/reveal = 1 credit, phone-finder = 5,
# location = 0. Those endpoints carry confidence `verified` with source `observed`; the routes the
# rate card is silent about carry the honest `inferred`.
#
# TWO BILLING QUIRKS worth knowing before estimating spend:
#   1. "If we can't find a valid email, your search is free" — a miss costs nothing (author-finder
#      returned an empty record on both test URLs and billed 0).
#   2. "Duplicate searches within the same month cost nothing" — a repeat of an identical query is
#      billed 0. Confirmed live: every endpoint below billed its rate on the first call and 0 on
#      the replay ~6 minutes later. A verification re-run is therefore free, and a naive per-call
#      spend estimate OVERSTATES real cost for repeated queries.
#
# RATE LIMITS ARE PER ROUTE AND TIGHT on this plan — /v1/rate-limits returns them live. Several
# routes are rps 1 / rpm 2 / daily 5 (author-finder, domain-search). Callers hitting these in a
# loop will see 429 {"errors":{"type":"rate_limit",...}} long before they run out of credits.
limits: "per-route, not account-wide — GET /v1/rate-limits returns the live rps/rpm/daily limits and current usage for every route. On the Growth plan several routes are rps 1 / rpm 2 / daily 5."
pricing_url: https://tomba.io/pricing
proposed_capabilities:
  companies.emails.list: "List every work email found on a company domain"
  companies.emails.count: "Count the emails known for a domain, by department & seniority"
  companies.emails.locations: "Where a domain's contacts are, by country"
  companies.tech_stack: "Technologies a website runs"
  companies.similar: "Find companies similar to a given domain"
  people.email.sources: "Where on the web an email address was seen"
  people.phone.verify: "Validate & format a phone number"
  web.domain.disposable: "Is a domain disposable or a free webmail host"
  account.usage: "Credits consumed so far this period"
  account.rate_limits: "Per-route rate limits and current usage"
  account.logs: "Recent API calls with the credits each one cost"
endpoints:
  - id: tomba.people.email.find
    domain: people
    capability: people.email.find
    platform: people
    scope: any_account
    method: GET
    path: /v1/email-finder
    name: "Find a work email from a name and domain"
    summary: "Name + company domain → the person's verified work email, with confidence score and the sources it was seen on"
    input:
      queryParams:
        domain: {type: string, required: true, note: "company domain, no protocol", example: "stripe.com"}
        full_name: {type: string, required: false, note: "full name; use INSTEAD of first_name/last_name", example: "Patrick Collison"}
        first_name: {type: string, required: false, note: "use together with last_name when you do not have the full name"}
        last_name: {type: string, required: false}
      note: "either full_name, or first_name + last_name. A miss is free (`score: 0`, null email)."
    test_request:
      queryParams: {domain: "stripe.com", full_name: "Patrick Collison"}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://tomba.io/pricing
      checked: '2026-08-20'
      confidence: verified
      note: "rate card says 1 credit per VALID email found; /v1/logs reported cost=1 for the live call and cost=0 for the identical replay (duplicates are free within the month)"
    verified: '2026-08-20'
    example_response: examples/tomba.people.email.find.json
    docs_url: https://docs.tomba.io/api/finder

