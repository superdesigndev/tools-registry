# facebook — EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries carry no
# capability, no verification and no example response — that is what the core
# facebook.yaml is for. Routes already curated there are excluded here.
# 
# META PUBLISHES NO SPEC. There is no OpenAPI document, no discovery document and no
# machine-readable index for the Graph API — the only source is the HTML reference, one page
# per node type. Hand-transcribing hundreds of routes out of HTML is how typos ship, so this
# file is deliberately SHORT: 26 entries, each an edge of a node type this provider's scopes
# can actually reach, read off the official reference page linked in every docs_url. Accuracy
# over volume — assume the Graph surface is much larger than what is listed here.
# 
# Paths are relative to base_url, which ALREADY ENDS IN /v25.0 — no entry repeats the version.
# Bumping the Graph version is a base_url change in oauth_providers.py, not an edit here.
# 
# treg's app requests pages_show_list, pages_read_engagement, read_insights (+ pages_manage_posts for the `post` capability).
# 6 entries need a scope beyond that and carry `scope_gap:`. Meta gates most of those behind
# App Review with a screencast per permission, so a scope gap here is a product decision, not
# a config change.
# 
# Graph ids are opaque and account-specific ({page_id}, {ad_account_id} — the latter includes
# its `act_` prefix), so nothing here carries a test_request; `treg connections resources`
# supplies the id for the connected account.

provider: facebook
source:
  method: hand-curated from the official Graph API HTML reference (Meta publishes no machine-readable spec)
  ingested: '2026-07-28'
  spec_urls:
  - https://developers.facebook.com/docs/graph-api/reference/page/
  - https://developers.facebook.com/docs/graph-api/reference
endpoints:
- id: facebook.x.comment-delete
  kind: action
  tier: extended
  platform: facebook
  method: DELETE
  path: /{comment_id}
  name: "Delete a comment on your Facebook Page"
  summary: Delete a comment on the Page's content
  scope: own_account
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: no per-call charge; counted against the app's Graph API rate limit
  docs_url: https://developers.facebook.com/docs/graph-api/reference/page/
  scope_gap: treg's OAuth app does not request this; needs pages_manage_engagement
  capability: facebook.comment.delete
