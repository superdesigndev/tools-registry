  kind: utility
  tier: extended
  platform: search-console
  method: POST
  path: /v1/urlTestingTools/mobileFriendlyTest:run
  name: "Run Google's mobile-friendly test on a URL"
  summary: mobileFriendlyTest.run — Runs Mobile-Friendly Test for a given URL.
  scope: any_account
  cost: &id001
    type: free
    value: 0
    currency: USD
    unit: call
    note: no per-call charge; billed against the API's daily quota
  docs_url: https://developers.google.com/webmaster-tools/v1/api_reference_index
