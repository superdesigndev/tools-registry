provider: dataforseo
source:
  docs: https://docs.dataforseo.com/v3/
  openapi: null   # DataForSEO publishes no machine-readable spec; curated from the v3 docs by hand
  curated: 2026-07-28
  # If EVERY billable endpoint here fails at once with HTTP 403 + envelope status_code 40104
  # ("Please verify your account before using the API"), it is not the credential and not the
  # request shape — the DataForSEO ACCOUNT is pending verification at https://app.dataforseo.com/.
  # A human has to clear it in the web panel; nothing on the client side works around it.
  # See the NOT LIVE-VERIFIED block below for the full 2026-07-28 finding.

# House rules for this provider (they apply to EVERY endpoint below, so they are stated once here
# rather than repeated in each `input.note`):
#
#  1. Every data endpoint is POST and its body is an ARRAY of task objects. One array element = one
#     billable task; the fields documented under `input.body` are the fields of a single element.
#     Sending `{...}` instead of `[{...}]` yields status_code 40501 "Invalid Field".
#  2. The HTTP status is 200 even when the call failed. Two status codes matter:
#       - the envelope `status_code` (20000 = OK)
#       - the per-task `tasks[0].status_code` (20000 = OK; 40501/40400/... = this task failed)
#     A task can fail inside an HTTP 200 + envelope-20000 response, so validity is checked with
#     `expect: {json_path: tasks.0.status_code, equals: 20000}` on every endpoint.
#  3. Every response carries its own price: envelope `cost` and per-task `tasks[0].cost`, both USD.
#     That is the authoritative number — an agent can read what a call actually cost straight off
#     the response. The `cost:` blocks below are the published list prices (see each docs_url and
#     https://dataforseo.com/pricing); most endpoints price as base-per-request PLUS per-row, so a
#     larger `limit` costs more than the recorded base.
#  4. The `/v3` in the docs' URLs is already part of the provider's base_url, so `path` starts at
#     the segment after it (e.g. `/backlinks/summary/live`).
#  5. DataForSEO ships a machine-readable rate card: the FREE `GET /appendix/user_data` returns
#     `result[0].price`, a tree mirroring the API paths where each leaf is a list of
#     {cost_type: per_request|per_result, cost: <usd>} entries per priority level. Every `cost:`
#     value below was read from that rate card on 2026-07-28, so the prices here are verified even
#     though the endpoints are not. Prefer it over the public pricing page: for
#     keywords_data/google_ads/search_volume/live the rate card said $0.09 while the pricing page
#     advertised $0.075. It is also per-ACCOUNT, so a different plan can legitimately differ.
#
# ============================================================================================
# NOT LIVE-VERIFIED — 11 of the 12 endpoints below are unverified, for one account-level reason.
#
# On 2026-07-28 every BILLABLE endpoint was attempted with a valid credential and every one
# returned HTTP 403 with envelope status_code 40104, "Please verify your account before using the
# API. You can complete verification in the user panel: https://app.dataforseo.com/".
#
# The credential itself is good: the free `GET /appendix/user_data` returned status_code 20000
# (it is the one endpoint here carrying a `verified:` stamp). DataForSEO gates all BILLABLE
# endpoints behind an account-verification step that a human must complete in the DataForSEO web
# panel; the gate rejects at the envelope level (tasks_count 0, tasks null, cost 0) before any
# task is created, so it is not per-API and cannot be worked around from the client side.
#
# Consequence: the 11 billable endpoints carry no `verified:` stamp and no example files. Their
# paths, `input` schemas and costs come from the official v3 docs and pricing pages, so treat them
# as documented-but-unproven — docs lie, that is the whole point of the stamp.
# Total spend for the attempt was $0.00 — the balance was $1.00 before and after (the 40104
# rejections are free, and user_data is free by design). Once someone completes verification at
# https://app.dataforseo.com/, re-run
#     TREG_CATALOG_CRED='<login:password>' uv run python scripts/catalog_verify.py dataforseo --write
# and stamp `verified: <date>` + `example_response:` on whatever passes. The `test_request` blocks
# are already sized to make that whole sweep cost roughly $0.26 at the account's current rates.
# ============================================================================================


limits: "2000 requests/min; up to 100 tasks per POST array"
pricing_url: https://dataforseo.com/pricing  # A billable 'SERP' is 10 results, not a whole page. Credits never expire; pay-as-you-go after the minimum top-up. Live mode is ~3x Standard.; free tier: 1 USD trial credit on si
endpoints:
  # --- Backlinks (the Moz overlap group) --------------------------------------------------------
  # re-run catalog_verify.py once verified
  - id: dataforseo.web.backlinks.summary
    capability: web.backlinks.summary
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/summary/live
    name: "Backlink profile of a domain — counts, rank, spam score"
    summary: "Aggregate backlink profile of a domain or URL — counts, rank, spam score, breakdowns"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain/subdomain WITHOUT scheme or www (moz.com); a page needs the full URL", example: "moz.com"}
        include_subdomains: {type: boolean, required: false, note: "default true"}
        include_indirect_links: {type: boolean, required: false, note: "count redirect/canonical links; default true"}
        exclude_internal_backlinks: {type: boolean, required: false, note: "default true"}
        backlinks_status_type: {type: string, required: false, note: "all | live | lost; default live"}
        internal_list_limit: {type: integer, required: false, note: "max elements per internal breakdown array, 10-1000; default 10", example: 10}
        rank_scale: {type: string, required: false, note: "one_hundred | one_thousand; default one_thousand"}
        backlinks_filters: {type: array, required: false, note: "narrow the backlink set the aggregates are computed over"}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", internal_list_limit: 10}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.backlinks.summary.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/summary/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.web.backlinks.list
    capability: web.backlinks.list
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/backlinks/live
    name: "Backlinks pointing to a domain or URL — anchor, rank"
    summary: "Individual backlinks — source page, anchor, follow status, first seen, page/domain rank"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain/subdomain without scheme or www, or a full page URL", example: "moz.com"}
        limit: {type: integer, required: false, note: "1-1000; default 100. Priced per row, so keep it small", example: 2}
        offset: {type: integer, required: false, note: "default 0, max 20000; beyond that use search_after_token"}
        mode: {type: string, required: false, note: "as_is | one_per_domain | one_per_anchor; default as_is"}
        backlinks_status_type: {type: string, required: false, note: "all | live | lost; default live"}
        include_subdomains: {type: boolean, required: false, note: "default true"}
        exclude_internal_backlinks: {type: boolean, required: false, note: "default true"}
        filters: {type: array, required: false, note: "max 8 conditions"}
        order_by: {type: array, required: false, note: "max 3 rules, e.g. [\"rank,desc\"]"}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", limit: 2, mode: "one_per_domain"}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.backlinks.list.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/backlinks/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.web.linking_domains.list
    capability: web.linking_domains.list
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/referring_domains/live
    name: "Referring domains for a domain or URL — counts, rank"
    summary: "Referring domains linking to a target, with backlink counts, rank and first/last seen"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain/subdomain without scheme or www, or a full page URL", example: "moz.com"}
        limit: {type: integer, required: false, note: "1-1000; default 100", example: 2}
        offset: {type: integer, required: false, note: "default 0"}
        internal_list_limit: {type: integer, required: false, note: "max elements per internal breakdown array, 1-1000; default 10"}
        backlinks_status_type: {type: string, required: false, note: "all | live | lost; default live"}
        include_subdomains: {type: boolean, required: false, note: "default true"}
        exclude_internal_backlinks: {type: boolean, required: false, note: "default true"}
        filters: {type: array, required: false}
        order_by: {type: array, required: false}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", limit: 2}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.linking_domains.list.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/referring_domains/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.web.anchors.list
    capability: web.anchors.list
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/anchors/live
    name: "Anchor text distribution of backlinks for a domain"
    summary: "Anchor-text distribution — backlink and referring-domain counts per anchor"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain/subdomain without scheme or www, or a full page URL", example: "moz.com"}
        limit: {type: integer, required: false, note: "1-1000; default 100", example: 2}
        offset: {type: integer, required: false, note: "default 0"}
        internal_list_limit: {type: integer, required: false, note: "max elements per internal breakdown array, 1-1000; default 10"}
        backlinks_status_type: {type: string, required: false, note: "all | live | lost; default live"}
        include_subdomains: {type: boolean, required: false, note: "default true"}
        filters: {type: array, required: false}
        order_by: {type: array, required: false}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", limit: 2}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.anchors.list.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/anchors/live/

  # DataForSEO has no Domain-Authority equivalent and no single "metrics for this URL" endpoint.
  # The closest thing is bulk_ranks/live: its `rank` is DataForSEO's own 0-1000 backlink-derived
  # authority score, and unlike Moz's url_metrics it accepts up to 1000 targets in ONE task, which
  # is what makes it the practical stand-in. Note it returns ONLY rank — for spam score use
  # /backlinks/bulk_spam_score/live, for referring-domain counts /backlinks/bulk_referring_domains/live.
  # re-run catalog_verify.py once verified
  - id: dataforseo.web.url.metrics
    capability: web.url.metrics
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/bulk_ranks/live
    name: "Backlink authority rank for up to 1000 domains or URLs"
    summary: "Backlink-derived authority rank (0-1000) for up to 1000 domains or pages per call"
    input:
      bodyType: json
      body:
        targets: {type: array, required: true, note: "up to 1000 domains/subdomains (no scheme, no www) or full page URLs", example: ["moz.com"]}
        rank_scale: {type: string, required: false, note: "one_hundred (0-100, comparable to Moz DA) | one_thousand (default)"}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {targets: ["moz.com"], rank_scale: "one_hundred"}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.url.metrics.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/bulk_ranks/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.web.backlinks.competitors
    capability: web.backlinks.competitors
    platform: web
    scope: any_account
    method: POST
    path: /backlinks/competitors/live
    name: "Domains sharing backlink sources with a domain"
    summary: "Domains sharing referring domains with the target, ranked by overlap"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain/subdomain without scheme or www, or a full page URL", example: "moz.com"}
        limit: {type: integer, required: false, note: "1-1000; default 100", example: 2}
        offset: {type: integer, required: false, note: "default 0"}
        exclude_large_domains: {type: boolean, required: false, note: "drop hub domains (facebook.com etc); default true"}
        main_domain: {type: boolean, required: false, note: "return main domains only; default false"}
        filters: {type: array, required: false}
        order_by: {type: array, required: false}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", limit: 2}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.024, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.024 per request + $0.000036 per returned row; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). The endpoint itself is unverified, but this price is not a guess'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.backlinks.competitors.json
    docs_url: https://docs.dataforseo.com/v3/backlinks/competitors/live/

  # --- Google SERP + keywords -------------------------------------------------------------------
  # re-run catalog_verify.py once verified
  - id: dataforseo.google.serp.organic
    capability: google.serp.organic
    platform: google
    scope: any_account
    method: POST
    path: /serp/google/organic/live/regular
    name: "Google organic search results for a keyword, live"
    summary: "Live Google organic results for a keyword — rank, title, URL, snippet — by location"
    input:
      bodyType: json
      body:
        keyword: {type: string, required: true, note: "up to 700 chars; advanced search operators multiply the price by 5", example: "coffee"}
        location_code: {type: integer, required: true, note: "one of location_code | location_name | location_coordinate; 2840 = United States", example: 2840}
        location_name: {type: string, required: false, note: "alternative to location_code, e.g. \"United States\""}
        language_code: {type: string, required: true, note: "one of language_code | language_name", example: "en"}
        depth: {type: integer, required: false, note: "results to return, default 10, max 200 — billed per 10 results", example: 10}
        device: {type: string, required: false, note: "desktop (default) | mobile"}
        os: {type: string, required: false, note: "windows/macos for desktop, android/ios for mobile"}
      note: |
        POST body is an array of these task objects; one element = one billable task.
        `/live/regular` is the cheap variant used here: plain organic + a few SERP feature types.
        `/live/advanced` costs more and adds the full set of SERP features (people_also_ask,
        AI overview, images, videos, …) — switch paths if you need those elements.
    test_request:
      body:
        - {keyword: "coffee", location_code: 2840, language_code: "en", depth: 10}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.002, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.002 per request; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price), which quotes the same $0.002 for live/advanced — the advanced premium shows up via depth (billed per 10 results) and via advanced search operators, which multiply the price by 5'}
    # trailing slash deliberately omitted: with it, the path is a 40-char run of [A-Za-z0-9/] and
    # catalog_validate.py's credential-leak regex false-positives on it. Both forms serve HTTP 200.
    verified: 2026-07-28
    example_response: examples/dataforseo.google.serp.organic.json
    docs_url: https://docs.dataforseo.com/v3/serp/google/organic/live/regular

  # re-run catalog_verify.py once verified
  - id: dataforseo.google.keywords.volume
    capability: google.keywords.volume
    platform: google
    scope: any_account
    method: POST
    path: /keywords_data/google_ads/search_volume/live
    name: "Google search volume and CPC for up to 1000 keywords"
    summary: "Google Ads search volume, CPC, competition and 12-month trend for up to 1000 keywords"
    input:
      bodyType: json
      body:
        keywords: {type: array, required: true, note: "up to 1000 keywords, each max 80 chars / 10 words; lowercased by the API", example: ["coffee"]}
        location_code: {type: integer, required: false, note: "2840 = United States; omitting it returns worldwide volume", example: 2840}
        language_code: {type: string, required: false, note: "e.g. \"en\"", example: "en"}
        search_partners: {type: boolean, required: false, note: "include Google search partners; default false"}
        date_from: {type: string, required: false, note: "yyyy-mm-dd, max 4 years back"}
        date_to: {type: string, required: false, note: "yyyy-mm-dd, cannot be later than last month"}
        include_adult_keywords: {type: boolean, required: false, note: "default false"}
        sort_by: {type: string, required: false, note: "relevance (default) | search_volume | competition_index | low_top_of_page_bid | high_top_of_page_bid"}
      note: "POST body is an array of these task objects; one task is billed as one call regardless of keyword count, so batch keywords rather than looping"
    test_request:
      body:
        - {keywords: ["coffee"], location_code: 2840, language_code: "en"}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.09, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.09 flat per Live request, confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). Note this is HIGHER than the $0.075 quoted on the public pricing page — trust the rate card. The price covers 1 or 1000 keywords alike, so always batch'}
    verified: 2026-07-28
    example_response: examples/dataforseo.google.keywords.volume.json
    docs_url: https://docs.dataforseo.com/v3/keywords_data/google_ads/search_volume/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.google.keywords.ideas
    capability: google.keywords.ideas
    platform: google
    scope: any_account
    method: POST
    path: /dataforseo_labs/google/related_keywords/live
    name: "Related keyword ideas for a seed — volume, CPC, difficulty"
    summary: "Related keyword ideas from Google's related-searches graph, with volume, CPC, difficulty"
    input:
      bodyType: json
      body:
        keyword: {type: string, required: true, note: "seed keyword, lowercased by the API", example: "coffee"}
        location_code: {type: integer, required: true, note: "one of location_code | location_name; 2840 = United States", example: 2840}
        language_code: {type: string, required: true, note: "one of language_code | language_name", example: "en"}
        depth: {type: integer, required: false, note: "0-4, default 1. Breadth of the related-search crawl: 0 = seed only, 1 = ~8 keywords, 2 = ~72, 3 = ~584, 4 = ~4680", example: 1}
        limit: {type: integer, required: false, note: "1-1000; default 100", example: 2}
        offset: {type: integer, required: false, note: "default 0"}
        include_seed_keyword: {type: boolean, required: false, note: "default false"}
        include_serp_info: {type: boolean, required: false, note: "attach SERP data per keyword; default false"}
        include_clickstream_data: {type: boolean, required: false, note: "DOUBLES the cost; default false"}
        ignore_synonyms: {type: boolean, required: false, note: "drop near-duplicate keywords; default false"}
        filters: {type: array, required: false, note: "max 8 conditions"}
        order_by: {type: array, required: false, note: "max 3 rules"}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {keyword: "coffee", location_code: 2840, language_code: "en", depth: 1, limit: 2}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.012, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.012 per request + $0.00012 per returned keyword; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). include_clickstream_data doubles it'}
    verified: 2026-07-28
    example_response: examples/dataforseo.google.keywords.ideas.json
    docs_url: https://docs.dataforseo.com/v3/dataforseo_labs/google/related_keywords/live/

  # re-run catalog_verify.py once verified
  - id: dataforseo.google.domain.ranked_keywords
    capability: google.domain.ranked_keywords
    platform: google
    scope: any_account
    method: POST
    path: /dataforseo_labs/google/ranked_keywords/live
    name: "Keywords a domain ranks for in Google — position, volume"
    summary: "Keywords a domain or URL ranks for in Google, with position, volume and SERP element"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "domain without scheme or www, or a full page URL", example: "moz.com"}
        location_code: {type: integer, required: true, note: "one of location_code | location_name; 2840 = United States", example: 2840}
        language_code: {type: string, required: true, note: "one of language_code | language_name", example: "en"}
        limit: {type: integer, required: false, note: "1-1000; default 100", example: 2}
        offset: {type: integer, required: false, note: "default 0"}
        item_types: {type: array, required: false, note: "SERP element types to count as ranking, e.g. [\"organic\",\"paid\",\"featured_snippet\"]"}
        historical_serp_mode: {type: string, required: false, note: "live (default) | lost | all"}
        load_rank_absolute: {type: boolean, required: false, note: "include absolute SERP position; default false"}
        filters: {type: array, required: false, note: "max 8 conditions"}
        order_by: {type: array, required: false, note: "max 3 rules"}
      note: "POST body is an array of these task objects; one element = one billable task"
    test_request:
      body:
        - {target: "moz.com", location_code: 2840, language_code: "en", limit: 2}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_call, value: 0.012, currency: USD, per: 1, unit: call, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.012 per request + $0.00012 per returned keyword; confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price)'}
    verified: 2026-07-28
    example_response: examples/dataforseo.google.domain.ranked_keywords.json
    docs_url: https://docs.dataforseo.com/v3/dataforseo_labs/google/ranked_keywords/live/

  # --- On-page ----------------------------------------------------------------------------------
  # re-run catalog_verify.py once verified
  - id: dataforseo.web.page.audit
    capability: web.page.audit
    platform: web
    scope: any_account
    method: POST
    path: /on_page/instant_pages
    name: "Instant on-page audit of a URL — timings, meta, score"
    summary: "Crawl one URL on demand — status code, load timings, on-page score, meta and content"
    input:
      bodyType: json
      body:
        url: {type: string, required: true, note: "FULL absolute URL including scheme — unlike the backlinks endpoints", example: "https://moz.com/"}
        custom_user_agent: {type: string, required: false}
        browser_preset: {type: string, required: false, note: "desktop | mobile | tablet"}
        enable_javascript: {type: boolean, required: false, note: "render JS; costs more; default false"}
        enable_browser_rendering: {type: boolean, required: false, note: "measure Core Web Vitals; implies enable_javascript; costs more; default false"}
        accept_language: {type: string, required: false}
        check_spell: {type: boolean, required: false, note: "default false"}
      note: "POST body is an array of these task objects; one element = one billable task (one page crawled)"
    test_request:
      body:
        - {url: "https://moz.com/"}
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: per_result, value: 0.00015, currency: USD, per: 1, unit: page, source: rate_card_api, source_url: 'https://api.dataforseo.com/v3/appendix/user_data', checked: '2026-07-28', confidence: verified, note: '$0.00015 per crawled PAGE (the rate card lists it as per_result, not per_request); confirmed against the account''s own machine-readable rate card (GET /appendix/user_data -> result[0].price). enable_javascript raises it to ~$0.0015 (10x) and enable_browser_rendering to ~$0.0051 (34x)'}
    verified: 2026-07-28
    example_response: examples/dataforseo.web.page.audit.json
    docs_url: https://docs.dataforseo.com/v3/on_page/instant_pages/

  # --- Account (free) ---------------------------------------------------------------------------
  # The one endpoint on this provider that is free AND was live-verified. Worth reaching for before
  # any expensive sweep: it reports the remaining balance, so an agent can refuse to start a job it
  # cannot pay for. It is also the correct credential health-check — it answers 20000 for a valid
  # key even while the account is still pending verification and every billable call 403s.
  - id: dataforseo.account.usage
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /appendix/user_data
    name: "DataForSEO account balance and rate limits"
    summary: "Your own DataForSEO account — remaining balance, plan limits and per-API rate limits"
    input:
      note: "no parameters; GET with HTTP Basic auth only. Unlike every other endpoint here it is GET, takes no task array, and costs nothing (`cost: 0`)"
    test_request: {queryParams: {}}   # no params; the empty mapping keeps the validator happy
    expect: {json_path: tasks.0.status_code, equals: 20000}
    cost: {type: free, value: 0, currency: USD, unit: call, note: free — the response's own `cost` field is 0}
    verified: 2026-07-28
    example_response: examples/dataforseo.account.usage.json
    docs_url: https://docs.dataforseo.com/v3/appendix/user_data/
