    verified: 2026-07-28
    example_response: examples/lusha.x.companies-prospecting-filters.json
    docs_url: https://docs.lusha.com/apis/openapi/company-filters

  - id: lusha.x.companies-enrich-by-id
    domain: companies
    tier: extended
    platform: companies
    method: POST
    path: /v3/companies/enrich
    name: "Enrich companies by Lusha id (up to 100)"
    summary: "Enrich companies you already found in a prospecting search, by ids (max 100), into full firmographic records"
    input:
      bodyType: json
      body:
        ids: {type: "array[string]", required: true, note: "1-100 Lusha company ids from a prior prospecting search — CORRECTED at verify time: the field is `ids`, not `companyIds` as the doc prose paraphrases it", example: ["16303253"]}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table"}
      note: "the id-based sibling of lusha.companies.enrich (which takes domain/name); use this once you already hold ids from POST /v3/companies/prospecting"
    test_request:
      body: {ids: ["v1.A1gXjPYd63SSPjSvxO4uwqXqE5ilJV9S"]}
    cost: {type: per_result, value: 1, currency: credit, per: 1, unit: result, source: docs, source_url: 'https://www.lusha.com/pricing/', checked: '2026-07-28', confidence: documented, note: billed on the reveal_company action per company returned; a no-match is free. Lusha does not publish the numeric credit cost — read GET /v3/account/usage.pricing for the calling plan's actual number.}
    skipped: "field-name bug fixed and a real id (from lusha.companies.search) is in test_request, but not called to conserve budget — lusha.companies.enrich (core) already verifies this exact reveal_company billing path against the same company (domain-based instead of id-based); top up credits and re-run to confirm the id-based variant specifically"
    docs_url: https://docs.lusha.com/apis/openapi/company-search-and-enrich

  - id: lusha.x.contacts-lookalike
    domain: contacts
    tier: extended
    platform: people
    method: POST
    path: /v3/contacts/lookalike
    name: "Find lookalike contacts from 5-100 seed contacts"
    summary: "AI-powered recommendations for contacts who share similar roles, seniority and company profile to 5-100 seed contacts"
    input:
      bodyType: json
      body:
        seeds: {type: object, required: true, note: "CORRECTED at verify time from the real OpenAPI bundle: seeds is a single object {linkedinUrls, contacts, emails, ids}, NOT an array of per-seed objects. Combined items across the sub-arrays must total 5-100", example: {ids: ["4389064654", "4389064624"]}}
        exclude: {type: object, required: false, note: "same ContactIdentifiersBatch shape as seeds"}
        dedupeSessionId: {type: string, required: false, note: "omit on the first call — Lusha generates one and returns it; reuse it for 'get more' pagination (retained 30 days)"}
        limit: {type: integer, required: false, note: "1-100, default 25"}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table"}
      note: "returns lightweight previews; call lusha.people.contacts.enrich on the returned ids for full details"
    test_request:
      body: {seeds: {ids: ["v1.-R1YwK7SIvBv1FVAOW1zmel9bZ4XD9mxNQ", "v1.ujDPLE3res-lYBnt6iiLr3jwCe9wXPdmrg", "v1.n0ghmmrFpkVf6z0q-rKCjt4kTMVGydVe", "v1.Ex7lVhKX97ZmbbTTg4AumQqE0SPKKsw", "v1.AUMmbUKy3d9zrSEMaIog-hADfblVwPQCZQ"]}, limit: 1}
    cost: {type: per_result, value: 1, currency: credit, per: 1, unit: result, source: observed, checked: '2026-07-28', confidence: verified, note: 'OBSERVED live 2026-07-28: 1 credit for 1 returned result (lookalikeContact, perQuantity 5 per account/usage pricing)'}
    verified: 2026-07-28
    example_response: examples/lusha.x.contacts-lookalike.json
    docs_url: https://docs.lusha.com/apis/openapi/lookalikes
    capability: people.lookalike

