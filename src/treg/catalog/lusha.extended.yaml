    cost: {type: per_result, value: 1, currency: credit, per: 1, unit: result, source: observed, checked: '2026-07-28', confidence: verified, note: 'OBSERVED live 2026-07-28: 1 credit for 1 returned result (lookalikeCompany, perQuantity 5 per account/usage pricing)'}
    verified: 2026-07-28
