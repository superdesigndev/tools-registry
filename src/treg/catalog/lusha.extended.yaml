        exclude: {type: object, required: false, note: "same CompanyIdentifiersBatch shape as seeds"}
        dedupeSessionId: {type: string, required: false, note: "omit on the first call; reuse the returned id for 'get more' pagination (retained 30 days)"}
        limit: {type: integer, required: false, note: "1-100, default 25"}
        tableId: {type: string, required: false, note: "persist results into a Lusha Table"}
