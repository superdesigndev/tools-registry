    skipped: "not called — same ephemeral-id constraint as lusha.x.webhook-subscription-get, and a create -> list -> get -> delete cycle already exercised this session's throwaway subscription end to end; a 5th mutating call on the same resource added no new evidence about auth or routing"
    docs_url: https://docs.lusha.com/apis/openapi/webhooks

  - id: lusha.x.webhook-subscriptions-delete
    kind: account
