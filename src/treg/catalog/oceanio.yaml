  # ---------------------------------------------------------------- ICP segmentation -----------
  - id: oceanio.companies.segment.create
    domain: companies
    capability: companies.segment.start
    platform: companies
    scope: any_account
    method: POST
    path: /v2/segmentation
    name: "Start an ICP segmentation from a list of domains"
    summary: "Create a new segmentation from a list of company domains"
    input:
      body:
        domains: {type: "array[string]", required: true, note: "the companies to group — typically your customer list or best-fit accounts", example: ["stripe.com", "adyen.com", "razorpay.com", "checkout.com", "mollie.com"]}
        leadScoringFeatures: {type: "array[string]", required: false, note: "which company attributes to cluster on, e.g. industries, technologies, company_size. Omit for the default set"}
        numberOfSegmentsMode: {type: integer, required: false, note: "bias toward fewer or more segments; omit to let the service choose"}
        positiveDomains: {type: "array[string]", required: false, note: "good-fit companies — the segmentation leans toward companies like these"}
        negativeDomains: {type: "array[string]", required: false, note: "poor-fit companies — the segmentation leans away from these"}
      note: "ASYNC but POLLABLE, unlike the webhook endpoints: it returns `segmentationId` immediately, then you poll oceanio.companies.segment.get until `status` is SUCCESSFUL. Free in our test. A handful of domains lands everything in one 'Other' segment — feed it a real list (dozens to hundreds) for useful clusters"
    test_request:
      body: {domains: ["stripe.com", "adyen.com", "razorpay.com", "checkout.com", "mollie.com"]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "OBSERVED live 2026-08-20: a 5-domain segmentation left the balance unchanged. The provider does not publish a price for this route, so a very large domain list may behave differently"}
    docs_url: https://app.ocean.io/docs/createSegmentation
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.segment.create.json

  - id: oceanio.companies.segment.get
    domain: companies
    capability: companies.segment.results
    platform: companies
    scope: any_account
    method: GET
    path: /v2/segmentation/{segmentation_id}
    name: "Get a segmentation's results"
    summary: "Retrieve a segmentation by its id, including its segments, traits, and CRM metrics once status is SUCCESSFUL"
    input:
      pathParams:
        segmentation_id: {type: integer, required: true, note: "the id returned by oceanio.companies.segment.create", example: 153746}
      note: "the poll half of the segmentation pair — free, so poll it freely. `status` moves to SUCCESSFUL, then `segments` carries one entry per cluster with its name, domains and companyCount"
    test_request:
      pathParams: {segmentation_id: 153746}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "OBSERVED live 2026-08-20: polled six times, balance unchanged"}
    docs_url: https://app.ocean.io/docs/getSegmentation
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.segment.get.json

  - id: oceanio.companies.segment.mark_domains
    domain: companies
    capability: companies.segment.feedback
    platform: companies
    scope: any_account
    method: POST
    path: /v2/segmentation/{segmentation_id}/markDomains
    name: "Mark companies good or poor fit"
    summary: "Append domains to the positive or negative list of an existing segmentation"
    input:
      pathParams:
        segmentation_id: {type: integer, required: true, note: "the segmentation to teach", example: 153746}
      body:
        domains: {type: "array[string]", required: true, note: "the domains to add to the list", example: ["adyen.com"]}
        type: {type: string, required: true, note: "\"positive\" (good fit) or \"negative\" (poor fit) — REQUIRED; omitting it returns 422", example: "positive"}
      note: "the feedback loop: closed-won accounts in as positive, churned or disqualified ones as negative, then re-run the segmentation. Returns {\"status\": \"updated\"}"
    test_request:
      pathParams: {segmentation_id: 153746}
      body: {domains: ["adyen.com"], type: "positive"}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "OBSERVED live 2026-08-20: balance unchanged"}
    docs_url: https://app.ocean.io/docs/addMarkedDomains
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.segment.mark_domains.json

  - id: oceanio.companies.segment.attribute
    domain: companies
    capability: companies.segment.attribute
    platform: companies
    scope: any_account
    method: POST
    path: /v2/segmentation/{segmentation_id}/attribute-domains
    name: "Assign domains to the closest segment, with match score"
    summary: "Assign each input domain to the closest segment in a segmentation, with a 0-1 match score"
    input:
      pathParams:
        segmentation_id: {type: integer, required: true, note: "a segmentation whose status is SUCCESSFUL", example: 153746}
      body:
        domains: {type: "array[string]", required: true, note: "domains to place into the existing segments, max 1000", example: ["gocardless.com"]}
      note: "the scoring half of segmentation — score inbound leads against an ICP you already built. NOT VERIFIED: on a freshly created segmentation the call returned HTTP 412 {\"detail\": \"Segmentation must be re-run to enable attribution.\"}, and re-running a segmentation is a dashboard action we did not want to trigger on the test account. Price also unconfirmed for the same reason"
    test_request:
      pathParams: {segmentation_id: 153746}
      body: {domains: ["gocardless.com"]}
    cost:
      type: per_call
      value: null
      currency: credit
      per: 1
      unit: call
      source: inferred
      checked: '2026-08-20'
      confidence: unknown
      note: 'NOT VERIFIED — the call returned 412 (segmentation needs re-running) before any billing could be observed. The three sibling segmentation routes are all free, so free is the likely answer, but treat it as unknown until a live call succeeds.'
    docs_url: https://app.ocean.io/docs/attributeSegmentationDomains

