provider: oceanio
source:
  docs: https://app.ocean.io/docs/
  openapi: https://api.ocean.io/openapi.json  # live spec, v2.0.0; every path below was read from it
  curated: '2026-08-20'
limits: "60 requests/minute and 1,000 requests/day for self-serve plans (enterprise limits are per contract). Over the limit you get 429 with Retry-After and X-RateLimit-Limit headers; the live daily counter comes back as `dailyLimitRateLeft` from GET /v2/credits/balance"
pricing_url: https://www.ocean.io/pricing
# Live-verified 2026-08-20 against api.ocean.io with a real key. Every cost below was measured, not
# transcribed: the JSON responses carry their own `creditsUsed`, and GET /v2/credits/balance was read
# before and after each call, so the credit numbers here are observed billing. They then matched the
# provider's PUBLISHED per-endpoint rate card (https://app.ocean.io/docs/getting-started/credits)
# line for line — observed and documented agree on all thirteen priced routes.
#
# Auth: the key rides as `X-Api-Token: <key>` (HTTP header names are case-insensitive; the spec spells
# it `x-api-token`, the docs `X-Api-Token`). A query form `?apiToken=<key>` also works but keeps the
# key in the URL, so the header is the one to use — and sending BOTH forms at once is a documented 400
# ("Conflicting API tokens provided in query parameters and headers").
# `Authorization: Bearer <key>` is rejected with 403.
#
# What makes this provider distinct in the enrichment shelf: the company record carries WEB TRAFFIC
# (visits, page views, pages per visit, bounce rate), the site's TECHNOLOGY STACK, and HEADCOUNT
# GROWTH over 3/6/12 months per company and per department — signals most B2B enrichment APIs do not
# return. The other distinct capability is LOOKALIKE search: give /v3/search/companies a set of
# `lookalikeDomains` and it returns semantically similar companies ranked A/B/C by relevance.
#
# ONE credit pool covers every endpoint — search, enrich, lookup, reveal and autocomplete all draw
# from the same balance (the balance route splits it into `oneTime` and `recurrent` grants, not into
# per-feature pools). What differs wildly is the RATE: a company enrich is 0.1 credit, a verified
# email is 1 and a direct phone is 10 — 10x and 100x. Gate the reveal endpoints; a naive fan-out over
# a search result is the way to burn a plan in one call. Running out returns 402 and charges nothing.
#
# Async pattern: /v2/enrich/companies, /v2/enrich/people, /v2/reveal/emails and /v2/reveal/phones all
# answer `{"status": "in progress"}` immediately and POST the result to a `webhookUrl` you supply.
# They are NOT pollable — there is no job-status route — so a caller with no public webhook endpoint
# should use the synchronous singles (/v2/enrich/company, /v2/enrich/person) or the bulk lookups
# (/v2/lookup/companies, /v2/lookup/people), which answer inline.
#
# Deliberately NOT listed (see notes.md): POST /v2/search/companies and POST /v2/search/people (the
# spec marks both deprecated in favour of the v3 routes), and POST /v3/search/companies/preview and
# POST /v3/search/people/preview (enterprise-only — both answered 403 "You are not allowed to access
# this feature" on a funded standard key, which the published rate card confirms as "Preview
# endpoints — not available on this plan").
#
# The four /v2/segmentation routes are in the live OpenAPI spec and work, but they do NOT appear in
# the provider's own documentation site (which advertises "20 endpoints across 6 groups" and omits
# them) and carry no published price. They are listed here because they answer a real job — turning a
# customer list into ICP clusters — but treat them as less stable than the documented surface.

proposed_capabilities:
  companies.lookalike: "Find companies similar to a set of seed domains"
  companies.coverage.check: "Check which domains the provider already has data for"
  companies.search.fields: "List the industries, technologies and regions you can filter on"
  companies.search.autocomplete: "Suggest valid company-search filter values as you type"
  people.search.autocomplete: "Suggest valid people-search filter values as you type"
  companies.segment.start: "Cluster a list of companies into ICP segments"
  companies.segment.results: "Read a finished segmentation's segments"
  companies.segment.feedback: "Mark companies as good or poor fit for a segmentation"
  companies.segment.attribute: "Assign new companies to an existing segment"

endpoints:
  # ---------------------------------------------------------------- company enrichment ---------
  - id: oceanio.companies.enrich
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /v2/enrich/company
    name: "Enrich a company — web traffic, tech stack, headcount"
    summary: "Match a company with our database and enrich it with additional information"
    input:
      body:
        company: {type: object, required: false, note: "the company to match. `domain` alone is enough and is by far the most reliable key; also accepts name, registrationNumber, email, phone, countryCode, state, city, streetAddress, postalCode, address, linkedin, twitter, facebook, instagram, xing, youtube", example: {domain: "stripe.com"}}
        people: {type: "array[object]", required: false, note: "people to match the company through, when you have a contact but not a domain — each entry takes name/firstName/lastName/jobTitle/email/phone/linkedin"}
        fields: {type: "array[string]", required: false, note: "which Company fields to return. Narrowing this cuts bandwidth and latency but NOT price. Omit for the full record", example: ["domain", "name", "webTraffic", "technologies", "headcountGrowth"]}
      note: "the returned record is the wide one — web traffic (visits, pageViews, pagesPerVisit, bounceRate), the site's technology stack and technologyCategories, headcountGrowth at 3/6/12 months, departmentSizes, revenue band, funding round, locations and LinkedIn industry. The response reports its own price in `creditsUsed`"
    test_request:
      body: {company: {domain: "stripe.com"}}
    cost:
      type: per_success
      value: 0.1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: the response body reported creditsUsed 0.1 and the standard-credit balance fell by exactly 0.1 (30.0 -> 29.9). Bulk lookup via /v2/lookup/companies is half the price per company (0.05) — prefer it whenever you are enriching by domain. Matches the published rate card: "Enrich Company — 0.1 credits / result".'
    docs_url: https://app.ocean.io/docs/enrichCompany
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.enrich.json

  - id: oceanio.companies.lookup_bulk
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /v2/lookup/companies
    name: "Enrich up to 1,000 companies by domain in one call"
    summary: "Lookup and enrich multiple companies by domain (max 1000). This endpoint provides simple, per-result pricing"
    input:
      body:
        domains: {type: "array[string]", required: true, note: "company domains, max 1000 per call. Domain redirections are resolved automatically", example: ["stripe.com", "anthropic.com"]}
        fields: {type: "array[string]", required: false, note: "which Company fields to return; omit for the full record", example: ["domain", "name", "employeeCountOcean", "webTraffic"]}
      note: "the cheapest way to enrich by domain — 0.05 credit per company found, half the price of /v2/enrich/company, and synchronous. Domains with no match come back as `company: null` and, per the response's own accounting, are not billed. `totalRequested`, `totalFound` and `creditsUsed` are returned alongside the records"
    test_request:
      body: {domains: ["stripe.com"]}
    cost:
      type: per_result
      value: 0.05
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: one domain requested, one found, response creditsUsed 0.05 and balance fell 29.9 -> 29.85. The list length is the price dial. Matches the published rate card: "Lookup Companies — 0.05 credits / result".'
    docs_url: https://app.ocean.io/docs/lookupCompanies
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.lookup_bulk.json

  - id: oceanio.companies.enrich_bulk
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: POST
    path: /v2/enrich/companies
    name: "Enrich companies in bulk (async, webhook)"
    summary: "Match companies with our database and enrich it with additional information"
    input:
      body:
        companyDataMapping: {type: object, required: true, note: "a dict of YOUR id -> a single-company enrich body, i.e. {\"c1\": {\"company\": {\"domain\": \"anthropic.com\"}}}. 1 to 10,000 entries. Your ids come back in the webhook payload so you can join the results", example: {c1: {company: {domain: "anthropic.com"}}}}
        webhookUrl: {type: string, required: true, note: "a PUBLIC https URL that receives the enriched companies when the job finishes. There is no status route to poll — without a reachable webhook you never see the results", example: "https://example.com/treg-webhook"}
        fields: {type: "array[string]", required: false, note: "which Company fields the webhook payload should carry", example: ["domain", "name", "employeeCountOcean"]}
      note: "ASYNC. The HTTP response is only {\"status\": \"in progress\"}; the data arrives at your webhook. For fewer than a thousand domains prefer /v2/lookup/companies, which is synchronous AND cheaper per company"
    test_request:
      body: {companyDataMapping: {c1: {company: {domain: "anthropic.com"}}}, webhookUrl: "https://example.com/treg-webhook", fields: ["domain", "name", "employeeCountOcean"]}
    cost:
      type: per_result
      value: 0.1
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: a one-company job debited 0.1 standard credit at submission time — the same rate as the synchronous single enrich, twice the bulk-lookup rate. Matches the published rate card: "Enrich Companies (Batch) — 0.1 credits / result". Only the accept was observed; the webhook delivery itself was not (no public endpoint available at curation time).'
    docs_url: https://app.ocean.io/docs/enrichCompanies
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.enrich_bulk.json

  - id: oceanio.companies.warmup
    domain: companies
    capability: companies.coverage.check
    platform: companies
    scope: any_account
    method: POST
    path: /v2/warmup/companies
    name: "Check which domains are covered before enriching (free)"
    summary: "Check available companies in Ocean's database and trigger process of data gathering for the missing ones"
    input:
      body:
        domains: {type: "array[string]", required: true, note: "domains to check and, if missing, queue for collection", example: ["stripe.com", "anthropic.com"]}
      note: "FREE, and the right first call before a big enrichment run: it returns `successfulDomains`, so you learn which domains are covered without paying to enrich them, and the misses start being crawled in the background. Re-run the enrich a while later for the ones that were missing"
    test_request:
      body: {domains: ["stripe.com", "anthropic.com"]}
    cost: {type: free, value: 0, currency: USD, unit: call, note: "listed as Free on the published rate card and stated as credit-free in the route description; OBSERVED live 2026-08-20 — the balance was unchanged across the call"}
    docs_url: https://app.ocean.io/docs/warmupCompanies
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.warmup.json

  # ---------------------------------------------------------------- people enrichment ----------
  - id: oceanio.people.enrich
    domain: people
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v2/enrich/person
    name: "Enrich a person — role, work history, skills, LinkedIn"
    summary: "Match a person with our database and enrich it with additional information"
    input:
      body:
        person: {type: object, required: true, note: "the person to match — id, name, firstName, lastName, jobTitle, email, phone, linkedin, twitter, facebook, country. A LinkedIn URL is the strongest key; name + company domain also resolves", example: {name: "Patrick Collison", linkedin: "https://www.linkedin.com/in/patrickcollison"}}
        company: {type: object, required: false, note: "the person's company, to disambiguate a common name. `domain` is enough", example: {domain: "stripe.com"}}
        revealEmails: {type: object, required: false, note: "{includeEmails: true, webhookUrl: '…'} — asks for verified email addresses too. THIS IS BILLED SEPARATELY at the reveal rate (about 1 credit per verified email) and delivered to the webhook, not inline"}
        revealPhones: {type: object, required: false, note: "{includePhones: true, webhookUrl: '…'} — asks for direct phone numbers. VERY expensive (about 10 credits per verified phone) and delivered to the webhook"}
      note: "the base call returns the profile — job title, seniorities, departments, full experience history with dates, skills, location, LinkedIn URL, connections and followers — for 0.1 credit. Leave revealEmails/revealPhones out unless you actually need contact details; they are 10x and 100x the price"
    test_request:
      body: {person: {name: "Patrick Collison", linkedin: "https://www.linkedin.com/in/patrickcollison"}, company: {domain: "stripe.com"}}
    cost:
      type: per_success
      value: 0.1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: response creditsUsed 0.1, balance fell by 0.1. Matches the published rate card: "Enrich Person — 0.1 credits / result". Excludes email/phone reveals, which draw from the same pool at 1 and 10 credits per verified value.'
    docs_url: https://app.ocean.io/docs/enrichPerson
    verified: '2026-08-20'
    example_response: examples/oceanio.people.enrich.json

  - id: oceanio.people.lookup_bulk
    domain: people
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v2/lookup/people
    name: "Enrich up to 1,000 people by LinkedIn handle in one call"
    summary: "Lookup and enrich multiple people by LinkedIn handle or Ocean ID (max 1000). This endpoint provides simple, per-result pricing"
    input:
      body:
        linkedinHandles: {type: "array[string]", required: false, note: "LinkedIn profile handles — the slug only, not the full URL (e.g. \"patrickcollison\")", example: ["patrickcollison"]}
        oceanIds: {type: "array[string]", required: false, note: "person ids returned by any other endpoint's `id` field"}
      note: "give either list or both; 1,000 entries across the two combined. Half the price of /v2/enrich/person per person and synchronous. Only matched people are returned, so compare `totalFound` against `totalRequested` to see the misses"
    test_request:
      body: {linkedinHandles: ["patrickcollison"]}
    cost:
      type: per_result
      value: 0.05
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: one handle requested, one found, response creditsUsed 0.05. Matches the published rate card: "Lookup People — 0.05 credits / result".'
    docs_url: https://app.ocean.io/docs/lookupPeople
    verified: '2026-08-20'
    example_response: examples/oceanio.people.lookup_bulk.json

  - id: oceanio.people.enrich_bulk
    domain: people
    capability: people.enrich
    platform: people
    scope: any_account
    method: POST
    path: /v2/enrich/people
    name: "Enrich people in bulk (async, webhook)"
    summary: "Match people with our database and enrich it with additional information"
    input:
      body:
        peopleDataMapping: {type: object, required: true, note: "a dict of YOUR id -> a single-person enrich body, i.e. {\"p1\": {\"person\": {\"linkedin\": \"…\"}, \"company\": {\"domain\": \"…\"}}}. 1 to 10,000 entries; your ids come back in the webhook payload", example: {p1: {person: {linkedin: "https://www.linkedin.com/in/patrickcollison"}}}}
        webhookUrl: {type: string, required: true, note: "a PUBLIC https URL that receives the enriched people when the job finishes. There is no status route to poll", example: "https://example.com/treg-webhook"}
      note: "ASYNC — the HTTP response is only {\"status\": \"in progress\"}. For fewer than a thousand people prefer /v2/lookup/people, which is synchronous and cheaper per person"
    test_request:
      body: {peopleDataMapping: {p1: {person: {linkedin: "https://www.linkedin.com/in/patrickcollison"}}}, webhookUrl: "https://example.com/treg-webhook"}
    cost:
      type: per_result
      value: 0.1
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: a one-person job debited 0.1 credit at submission. Matches the published rate card: "Enrich People (Batch) — 0.1 credits / result". Only the accept was observed; the webhook delivery was not (no public endpoint available at curation time).'
    docs_url: https://app.ocean.io/docs/enrichPeople
    verified: '2026-08-20'
    example_response: examples/oceanio.people.enrich_bulk.json

  # ---------------------------------------------------------------- search / lookalike ---------
  - id: oceanio.companies.search
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: POST
    path: /v3/search/companies
    name: "Search companies by industry, technology or region"
    summary: "Search companies using filters"
    input:
      body:
        size: {type: integer, required: false, note: "how many companies to return, max 10,000. THIS IS THE PRICE DIAL — you are billed per company returned. Use `searchAfter` for more than 10,000", example: 2}
        searchAfter: {type: string, required: false, note: "the cursor returned by the previous call; pass it back for the next page"}
        companiesFilters: {type: object, required: false, note: "the company filter block. `lookalikeDomains` is the headline one — seed it with domains you already like and the result is companies semantically similar to them, each row tagged `relevance` A/B/C. The rest: includeDomains, excludeDomains, companySizes, employeeCountOcean, employeeCountLinkedin, revenues, yearFounded, fundingRound, industries, excludeIndustries, industryCategories, linkedinIndustries, primaryLocations, otherLocations, countriesCount, locationsCount, technologies, keywords, webTraffic, socialMedias, mobileApps, ecommerce, departmentSizes, headcountGrowth, departmentHeadcountGrowth, minRelevance, maxRelevance, updatedWithinMonths, fieldsExist, fieldsNotExist, companyMatchingMode", example: {lookalikeDomains: ["stripe.com"]}}
        peopleFilters: {type: object, required: false, note: "narrows to companies that EMPLOY people matching these filters — seniorities, departments, jobTitleKeywords, skills, countries, cities, states and more"}
        fields: {type: "array[string]", required: false, note: "which Company fields to return; omit for the full record", example: ["domain", "name", "webTraffic", "technologies", "headcountGrowth"]}
      note: "the provider's distinctive endpoint. `total` reports the full match count while `size` controls how many you pay for, so run with a small size first to size a segment before buying it. Valid values for the industries/technologies/regions filters come from GET /v2/data-fields"
    test_request:
      body:
        size: 2
        companiesFilters: {lookalikeDomains: ["stripe.com"]}
        fields: ["domain", "name", "description", "employeeCountOcean", "webTraffic", "technologies", "headcountGrowth", "primaryCountry", "industries"]
    cost:
      type: per_result
      value: 0.2
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: size=2 returned creditsUsed 0.4 and the balance fell by 0.4 — 0.2 per company returned, four times the bulk-lookup rate. `size` is the whole price. Matches the published rate card: "Search Companies — 0.2 credits / result".'
    docs_url: https://app.ocean.io/docs/searchCompaniesV3
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.search.json

  - id: oceanio.companies.lookalike
    domain: companies
    capability: companies.lookalike
    platform: companies
    scope: any_account
    method: POST
    path: /v3/search/companies
    name: "Find lookalike companies from seed domains"
    summary: "Search companies using filters — seeded with lookalikeDomains, this returns companies similar to your seeds"
    input:
      body:
        companiesFilters: {type: object, required: true, note: "must carry `lookalikeDomains`: a list of seed domains (your best customers, a competitor's logo wall). Combine with the ordinary filters — primaryLocations, companySizes, industries — to constrain the neighbourhood", example: {lookalikeDomains: ["stripe.com", "adyen.com"], companySizes: ["201-500"]}}
        size: {type: integer, required: false, note: "how many similar companies to return — the price dial, max 10,000", example: 2}
        searchAfter: {type: string, required: false, note: "cursor from the previous page"}
        fields: {type: "array[string]", required: false, note: "which Company fields to return"}
      note: "the same route as oceanio.companies.search, listed separately because lookalike-by-seed-domain is a job of its own and few providers do it. Each row carries `relevance`: A / B / C. `minRelevance` and `maxRelevance` inside companiesFilters let you keep only the close matches"
    test_request:
      body:
        size: 2
        companiesFilters: {lookalikeDomains: ["stripe.com"]}
        fields: ["domain", "name", "description", "employeeCountOcean", "webTraffic", "technologies", "headcountGrowth", "primaryCountry", "industries"]
    cost:
      type: per_result
      value: 0.2
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20 on the same call as oceanio.companies.search: size=2 with lookalikeDomains=["stripe.com"] returned 15,286 total matches and creditsUsed 0.4. Matches the published rate card: "Search Companies — 0.2 credits / result".'
    docs_url: https://app.ocean.io/docs/searchCompaniesV3
    verified: '2026-08-20'
    example_response: examples/oceanio.companies.lookalike.json

  - id: oceanio.people.search
    domain: people
    capability: people.search
    platform: people
    scope: any_account
    method: POST
    path: /v3/search/people
    name: "Search people by job title, skills or company filters"
    summary: "Search people using filters and/or people Ids"
    input:
      body:
        size: {type: integer, required: false, note: "how many people to return, max 10,000. THIS IS THE PRICE DIAL — billed per person returned", example: 2}
        peopleFilters: {type: object, required: false, note: "seniorities, departments, excludeDepartments, jobTitleKeywords, skills, names, countries, excludeCountries, regions, states, cities, currentJobDescription, allJobDescriptions, profileDescription, connections, followers, changedPositionAfter/Before (the job-change signal), includeLinkedinHandles, excludeLinkedinHandles, includePeopleIds, excludePeopleIds, lookalikeLinkedinHandles, updatedWithinMonths, fieldsExist, fieldsNotExist", example: {seniorities: ["C-Level"]}}
        companiesFilters: {type: object, required: false, note: "restricts the search to people at companies matching this block — the same filters as the company search, including lookalikeDomains", example: {includeDomains: ["stripe.com"]}}
        peoplePerCompany: {type: integer, required: false, note: "cap on people returned per company, so one big employer does not eat the whole page. Omit to take everyone"}
        jobTitleThreshold: {type: number, required: false, note: "0-1 similarity floor for jobTitleKeywords matching; default 0.8"}
        searchAfter: {type: string, required: false, note: "cursor from the previous page"}
        fields: {type: "array[string]", required: false, note: "which Person fields to return; omit for the default set"}
      note: "combine companiesFilters (who the account is) with peopleFilters (who the buyer is) to build a contact list in one call. Emails and phones are NOT included — reveal them separately, and expensively, via /v2/reveal/emails and /v2/reveal/phones using the `id` of each person returned here. `lookalikeLinkedinHandles` does the people equivalent of lookalike company search"
    test_request:
      body:
        size: 2
        companiesFilters: {includeDomains: ["stripe.com"]}
        peopleFilters: {seniorities: ["C-Level"]}
    cost:
      type: per_result
      value: 0.2
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://app.ocean.io/docs/getting-started/credits
      checked: '2026-08-20'
      confidence: verified
      note: 'OBSERVED live 2026-08-20: size=2 returned creditsUsed 0.4 and the balance fell 29.4 -> 29.0 — 0.2 per person returned. Matches the published rate card: "Search People — 0.2 credits / result".'
    docs_url: https://app.ocean.io/docs/searchPeopleV3
    verified: '2026-08-20'
    example_response: examples/oceanio.people.search.json

  # ---------------------------------------------------------------- contact reveal -------------
  - id: oceanio.people.email.reveal
    domain: people
    capability: people.email.find
    platform: people
    scope: any_account
    method: POST
    path: /v2/reveal/emails
    name: "Reveal verified work emails for person ids (async)"
    summary: "Get emails and email statuses for people"
    input:
      body:
        personIds: {type: "array[string]", required: true, note: "Ocean person ids — the `id` field of any person returned by enrich, lookup or search. One email credit is charged for every VERIFIED email found", example: ["8646fe23931d019b"]}
        webhookUrl: {type: string, required: true, note: "a PUBLIC https URL that receives the addresses and their verification statuses. There is no status route to poll — the inline response is only {\"status\": \"in progress\"}", example: "https://example.com/treg-webhook"}
      note: "EXPENSIVE relative to enrichment — about 10x an enrich per verified address — and asynchronous. Accounts on plans with a dedicated email-credit pool spend that pool; on the account we tested the charge came out of the standard balance. Nothing is charged for a person whose address cannot be verified"
    test_request:
