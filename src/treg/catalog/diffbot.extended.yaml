# diffbot — EXTENDED tier: the provider's full documented endpoint surface beyond the
# Knowledge Graph enrich/search entries curated in diffbot.yaml. Diffbot ships no fetchable
# OpenAPI/spec (readme.io docs only, as noted in the core file); every entry below is
# transcribed by hand from docs.diffbot.com's reference pages, cited per-endpoint in `docs_url`.
#
# VERIFIED 2026-07-28, extended 2026-07-31 — 13 of 17 endpoints were live-tested against a real
# free-plan (kgfree) key and passed: the 9 Extract APIs, web-search, nl-process, account, and (new
# on 2026-07-31) the crawl job list. The remaining 4 Crawl/Bulk-job endpoints are `untestable`
# because each needs a job that does not exist yet and creating one starts a real billed crawl —
# NOT because of a plan gate, see the CORRECTION below.
# Neither catalog_verify.py nor catalog_verify_extended.py
# understands this file's `host:` field — both always call `prov.base_url` (kg.diffbot.com), which
# is the WRONG host for every entry below — so verification here was done with direct calls
# against each entry's documented host and the results stamped by hand; re-verifying through
# either script as-is will 404 against the KG host and must not be read as these routes breaking.
#
# Two auth surprises found only by calling, not documented anywhere:
#   - diffbot.x.web-search (llm.diffbot.com) rejects `?token=` and requires an
#     `Authorization: Bearer <token>` HEADER instead — the opposite of every other route in this
#     provider. treg's registry configures diffbot with token_location=query for the whole
#     provider, so the auto-provisioned tool CANNOT call this endpoint as-is; noted on the entry.
#   - diffbot.x.nl-process (nl.diffbot.com) does accept `?token=` as documented; an initial attempt
#     that put the token in the JSON body instead (matching a plausible reading of the docs) 401'd.
#   - diffbot.x.extract-product's first probe target (a Micro Center SKU from the docs' own
#     example) both 403'd and later 404'd — dead/blocked, not a broken endpoint. Retargeted to
#     books.toscrape.com, a stable public scraping sandbox, which passed cleanly.
#
# FOUR HOSTS, ONE PROVIDER. `base_url` (kg.diffbot.com/kg/v3, see diffbot.yaml) covers only the
# Knowledge Graph. Every entry below needs an explicit `host:` because none of them resolve
# against base_url — same trap as the moz-account precedent, times three:
#   - api.diffbot.com/v3/...  — the Extract APIs (analyze, article, product, image, video,
#     discussion, job, list, event), the Crawl API, the Bulk Extract API, and /v4/account.
#   - llm.diffbot.com         — Web Search API.
#   - nl.diffbot.com          — Natural Language API (POST-only, JSON body).
# Auth on every route below is the same `?token=` query parameter used on the KG host.
#
# Billing: Diffbot's published credit table (diffbot.com/pricing) prices a single Extract API
# page fetch at 1 credit (2 credits if `useProxy=default` routes it through Diffbot's datacenter
# proxy). Crawl and Bulk jobs are billed per PAGE PROCESSED through whichever Extract API
# `apiUrl` names, at that API's per-page rate — not a flat per-job charge, so `cost.value` stays
# null and the rate lives in the note. Natural Language API is 1 credit per 10,000 characters of
# input (document cap 100,000 chars, request cap 1,000,000 chars). Web Search API pricing is not
# broken out on the credit table.
#
# CORRECTION 2026-07-31 — the "Plus plans and up" gate these five endpoints carried was TRANSCRIBED
# FROM THE DOCS AND IS NOT TRUE OF THE API. On this Free-plan (kgfree) token, GET /v3/crawl and
# GET /v3/bulk both answer HTTP 200 with `{"jobs":[]}`, and GET /v3/bulk/data 302-redirects to the
# results host rather than refusing. Nothing was gated; the four that remain untestable need an
# existing job name, which is a different and much smaller problem — one POST creates one. The
# docs' access note is what this header used to repeat, and repeating a doc claim as if it were an
# observation is exactly what the `verified` stamp exists to prevent.
#
# TRAILING-SLASH TRAP, confirmed live 2026-07-31: `/v3/bulk/` (with the slash) is REJECTED —
# `{"errorCode":457,"error":"Invalid API. … Check that it does not contain any unnecessary trailing
# backslashes."}` — while `/v3/bulk` succeeds. The path below was carrying the slash. Diffbot names
# the cause in the error, which is kinder than most; do not add one back.

provider: diffbot
source:
  method: official docs (no OpenAPI/spec published)
  ingested: '2026-07-28'
  spec_urls:
    - https://docs.diffbot.com/reference/extract-analyze
    - https://docs.diffbot.com/reference/article
    - https://docs.diffbot.com/reference/product
    - https://docs.diffbot.com/reference/image
    - https://docs.diffbot.com/reference/video
    - https://docs.diffbot.com/reference/discussion
    - https://docs.diffbot.com/reference/job
    - https://docs.diffbot.com/reference/list
    - https://docs.diffbot.com/reference/event
    - https://docs.diffbot.com/reference/crawl-introduction
    - https://docs.diffbot.com/reference/create-a-crawl
    - https://docs.diffbot.com/reference/manage-a-crawl-job
    - https://docs.diffbot.com/reference/retrieve-crawl-job-data
    - https://docs.diffbot.com/reference/bulk-job-introduction
    - https://docs.diffbot.com/reference/create-a-bulk-job
    - https://docs.diffbot.com/reference/retrieve-bulk-job-data
