    - https://www.diffbot.com/pricing/
endpoints:
  - id: diffbot.x.extract-analyze
    tier: extended
    capability: web.scrape.structured
    platform: web
    host: api.diffbot.com
    method: GET
    path: /v3/analyze
    name: "Auto-detect a page type and extract it by URL"
    summary: "Automatically identifies the type of page being processed and routes it through the relevant Diffbot API"
    input:
      queryParams:
        url: {type: string, required: true, note: "target URL to extract, URL-encoded", example: "https://www.technologyreview.com/2020/09/04/1008156/knowledge-graph-ai-reads-web-machine-learning-natural-language-processing/"}
        mode: {type: string, required: false, note: "restrict extraction to one page type: article, product, discussion, image, video, list, event"}
        fallback: {type: string, required: false, note: "which API to fall back to if page type cannot be determined"}
        fields: {type: string, required: false, note: "comma-delimited optional fields: links, extlinks, meta, querystring, breadcrumb"}
        discussion: {type: boolean, required: false, note: "pass false to disable automatic comment/review extraction", example: true}
        timeout: {type: integer, required: false, note: "ms to wait for content retrieval", example: 30000}
        proxy: {type: string, required: false, note: "custom proxy IP for fetching the target page"}
        proxyAuth: {type: string, required: false, note: "username:password for the custom proxy"}
        useProxy: {type: string, required: false, note: "'default' routes through Diffbot's datacenter proxy (2 credits/page instead of 1); 'none' disables proxies"}
        renderDelay: {type: integer, required: false, note: "extra rendering ms before DOM extraction, max 180000"}
        scroll: {type: string, required: false, note: "'slow' or 'fast' — triggers lazy-loaded content"}
        callback: {type: string, required: false, note: "JSONP callback for cross-domain AJAX"}
      note: "different HOST than base_url — api.diffbot.com, not kg.diffbot.com"
    test_request:
      queryParams: {url: "https://www.diffbot.com/products/extract/"}
    cost:
      type: per_call
      value: 1
      currency: credit
      per: 1
      unit: page
      source: observed
      source_url: https://www.diffbot.com/pricing/
      checked: '2026-07-31'
      confidence: verified
      note: 1 credit per page (2 with useProxy=default) OBSERVED 2026-07-31 — GET /v4/account's daily usage rows reconcile exactly to credits = 25*entities + 1*extractions + 1*nlp on two independent days — 2026-07-28 billed 136 for 5 entities + 10 extractions + 1 nlp, and 2026-07-30 billed 60 for 2 + 9 + 1, which is the whole charge with nothing left over. The 2-credit useProxy=default rate was not exercised and stays documented.
    verified: 2026-07-28
    example_response: examples/diffbot.x.extract-analyze.json
    docs_url: https://docs.diffbot.com/reference/extract-analyze

