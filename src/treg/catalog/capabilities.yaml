# The shared capability taxonomy — the cross-provider join key of the endpoint catalog.
# Rules (see docs/context/architecture/catalog.md):
#   - a capability id is dot-delimited lowercase; the FIRST segment is the platform slug (must exist below).
#   - an id names the JOB, and its description is an ACTION PHRASE a non-expert understands at a
#     glance ("List all videos of a YouTube channel"), never a noun pile or the provider's endpoint name.
#   - additions arrive via `proposed_capabilities:` blocks in provider files, merged here on review.
#
# Each platform carries the marketplace `category` it browses under (the dashboard tabs:
# SEO / Advertising / Social media / Enrichment / Community). `Other` is for meta shelves like
# `account` that should not appear as a browsable tab tile.

