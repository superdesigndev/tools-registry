# unverified — endpoints require a connected OAuth account; verify via a treg connection later.
#
# This is TikTok's OWN Display API (open.tiktokapis.com), reached with the creator's OAuth token.
# It only ever answers for the account that consented — hence scope own_account on everything —
# but the numbers are the creator's real ones (including private videos and stats TikTok never
# renders publicly). The any_account equivalents are in tikhub.yaml / justoneapi.yaml.
#
# Scopes granted by treg's app: user.info.basic, user.info.profile, user.info.stats, video.list
# (+ video.upload / video.publish on the draft/post capabilities). Anything needing
# research.* (TikTok's Research API) or video.insights is NOT requested and is absent below.
#
# Quirk that dominates this API: both endpoints take the requested `fields` as a QUERY parameter
# and everything else in a JSON body — asking for a field the grant doesn't cover fails the whole
# call rather than omitting that field.
provider: tiktok
source:
  docs: https://developers.tiktok.com/doc/display-api-overview/
  openapi: null
  curated: 2026-07-28

pricing_url: https://developers.tiktok.com/doc/display-api-get-started
endpoints:
  - id: tiktok.tiktok.user.profile
    capability: tiktok.user.profile
    platform: tiktok
    scope: own_account
    method: GET
    path: /v2/user/info/
    name: "Your TikTok profile — follower and like counts"
    summary: "Get your own TikTok profile with follower, following and total-like counts"
    input:
      queryParams:
        fields: {type: string, required: true, note: "comma-separated. open_id, union_id, avatar_url, display_name, bio_description, profile_deep_link, is_verified need user.info.basic/profile; follower_count, following_count, likes_count, video_count need user.info.stats", example: "open_id,display_name,avatar_url,bio_description,follower_count,following_count,likes_count,video_count"}
      note: "trailing slash on the path is required. Requesting a field outside the granted scopes fails the entire request with scope_not_authorized"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account; TikTok applies per-app rate limits (600 requests/minute per access token) rather than per-call pricing}
    docs_url: https://developers.tiktok.com/doc/display-api-get-user-info/

  - id: tiktok.tiktok.user.videos
    capability: tiktok.user.videos
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/video/list/
    name: "Your TikTok videos — views, likes, comments, shares"
    summary: "List your own TikTok videos with view, like, comment and share counts"
    input:
      queryParams:
        fields: {type: string, required: true, note: "comma-separated video fields", example: "id,title,video_description,duration,cover_image_url,share_url,create_time,view_count,like_count,comment_count,share_count"}
      body:
        max_count: {type: integer, required: false, note: "1–20, default 10", example: 20}
        cursor: {type: integer, required: false, note: "UTC milliseconds; pass the `cursor` from the previous response to page backwards in time", example: 0}
      bodyType: json
      note: "fields ride in the QUERY STRING, paging in the JSON BODY — an easy thing to get backwards. Response carries has_more + cursor. Only videos of the authorized creator are ever returned; there is no way to list another user's videos on this API"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'included with the connected account; rate-limited (600 requests/minute per access token), no per-call charge'}
    docs_url: https://developers.tiktok.com/doc/display-api-get-video-list/

  # --- publishing (the `draft` and `post` capabilities) ---------------------------------------
  #
  # TikTok's Content Posting API is four routes that form one flow, and WHICH init route you call
  # is what decides whether the content is published or merely dropped in the creator's inbox:
  #
  #   video, published outright   POST /v2/post/publish/video/init/         needs video.publish
  #   video, to the creator inbox POST /v2/post/publish/inbox/video/init/   needs video.upload
  #   photo post (either mode)    POST /v2/post/publish/content/init/       post_mode picks
  #
  # Every init answers {data: {publish_id, upload_url?}} and NOTHING is live yet. Video bytes are
  # then PUT to upload_url (see the chunk rules on the init entries), and the result is polled at
  # /v2/post/publish/status/fetch/ until PUBLISH_COMPLETE — which can take minutes.
  #
  # The inbox route is the reason treg splits `draft` from `post`: it puts the video in the
  # creator's TikTok inbox for them to finish by hand, and TikTok discards it after 24 hours. A
  # caller that wants review-before-publish must hold video.upload WITHOUT video.publish.
  #
  # UNAUDITED-APP TRAP: until TikTok audits the app, every direct post is forced to SELF_ONLY
  # (private) regardless of the privacy_level sent, and creator_info reports the allowed values.
  # Always read tiktok.creator.info first rather than assuming PUBLIC_TO_EVERYONE will stick.
  - id: tiktok.tiktok.creator.info
    kind: account
    capability: tiktok.creator.info
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/post/publish/creator_info/query/
    name: "Your TikTok posting permissions and limits"
    summary: "Get what the connected TikTok creator is allowed to post (privacy options, limits)"
    input:
      note: "no parameters — an empty POST with Content-Type: application/json; charset=UTF-8. Returns creator_nickname, privacy_level_options (the ONLY privacy_level values the direct-post call will accept for this creator), max_video_post_duration_sec, and the comment/duet/stitch toggles the account has disabled. TikTok's own guidelines REQUIRE calling this before a direct post and showing the creator these options — an app that hardcodes them fails audit. Needs video.publish or video.upload"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account; TikTok rate-limits per access token (600 requests/minute) rather than charging per call}
    unverified: "part of the publish flow — requires a `draft` or `post` connection; test manually"
    docs_url: https://developers.tiktok.com/doc/content-posting-api-reference-query-creator-info/

  - id: tiktok.tiktok.video.publish.init
    kind: action
    capability: tiktok.video.publish
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/post/publish/video/init/
    name: "Publish a video to your TikTok profile"
    summary: "Publish a video directly to your own TikTok profile"
    input:
      body:
        post_info: {type: object, required: true, note: "{\"title\": \"caption, 2,200 chars, #hashtags and @mentions work\", \"privacy_level\": one of creator_info's privacy_level_options, \"disable_comment\": false, \"disable_duet\": false, \"disable_stitch\": false, \"video_cover_timestamp_ms\": 1000, \"is_aigc\": false, \"brand_content_toggle\": false, \"brand_organic_toggle\": false}. is_aigc labels AI-generated content and is required to be honest", example: {title: "Behind the build #engineering", privacy_level: "SELF_ONLY", disable_comment: false, is_aigc: false}}
        source_info: {type: object, required: true, note: "FILE_UPLOAD: {\"source\": \"FILE_UPLOAD\", \"video_size\": <exact bytes>, \"chunk_size\": <bytes>, \"total_chunk_count\": <n>}. PULL_FROM_URL: {\"source\": \"PULL_FROM_URL\", \"video_url\": \"…\"} — but the URL's domain must first be verified in the TikTok developer portal, so FILE_UPLOAD is the route that works without portal setup", example: {source: "FILE_UPLOAD", video_size: 8388608, chunk_size: 8388608, total_chunk_count: 1}}
      bodyType: json
      note: "needs the `post` capability (video.publish); a `draft` connection gets scope_not_authorized. Returns {data: {publish_id, upload_url}}. CHUNK RULES, which TikTok enforces strictly: a chunk is 5 MB to 64 MB, so a file <= 64 MB goes as ONE chunk of the whole size; larger files use 10 MB chunks with total_chunk_count = floor(size / chunk_size) and the LAST chunk carrying the remainder (it may exceed chunk_size). PUT each chunk to upload_url with Content-Range: bytes start-end/total — chunked PUTs answer 206, not 200. Then poll tiktok.publish.status; publishing is not done when the upload finishes"
    cost: {type: free, value: 0, currency: USD, unit: call, note: included with the connected account; TikTok rate-limits per token (600 req/min) and caps direct posts at 6 per minute per creator}
    unverified: "write action — this publishes to a real TikTok account; requires a deliberate manual test, never an automated verify run"
    docs_url: https://developers.tiktok.com/doc/content-posting-api-reference-direct-post/

  - id: tiktok.tiktok.video.inbox.init
    kind: action
    capability: tiktok.video.draft
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/post/publish/inbox/video/init/
    name: "Send a video draft to your TikTok inbox"
    summary: "Send a video to your TikTok inbox as a draft for you to finish and post"
    input:
      body:
        source_info: {type: object, required: true, note: "identical shape and identical chunk rules to the direct-post route", example: {source: "FILE_UPLOAD", video_size: 8388608, chunk_size: 8388608, total_chunk_count: 1}}
      bodyType: json
      note: "takes NO post_info — caption, privacy and the comment/duet/stitch toggles are the creator's to set in the app, which is the entire point of this route. Needs only video.upload (treg's `draft` capability), so a connection that must never publish autonomously can still hand a video over. TikTok DISCARDS an unfinished inbox video after 24 hours. Polling tiktok.publish.status returns SEND_TO_USER_INBOX rather than PUBLISH_COMPLETE, and there is no post id to return"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'included with the connected account; rate-limited per token, no per-call charge'}
    unverified: "write action — pushes media to a real creator's inbox; requires a deliberate manual test, never an automated verify run"
    docs_url: https://developers.tiktok.com/doc/content-posting-api-reference-upload-video/

  - id: tiktok.tiktok.content.init
    kind: action
    capability: tiktok.photo.publish
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/post/publish/content/init/
    name: "Publish a photo post to your TikTok profile"
    summary: "Publish a photo post to your own TikTok profile, or send it to your inbox"
    input:
      body:
        post_mode: {type: string, required: true, note: "DIRECT_POST publishes (needs video.publish); MEDIA_UPLOAD drops it in the creator's inbox (needs only video.upload)", example: "DIRECT_POST"}
        media_type: {type: string, required: true, note: "PHOTO", example: "PHOTO"}
        post_info: {type: object, required: true, note: "{\"title\": \"post title, 90 chars\", \"description\": \"the caption\", \"privacy_level\": …, \"disable_comment\": false, \"auto_add_music\": true}", example: {title: "Three shots from today", description: "Behind the build", privacy_level: "SELF_ONLY", auto_add_music: true}}
        source_info: {type: object, required: true, note: "{\"source\": \"PULL_FROM_URL\", \"photo_cover_index\": 0, \"photo_images\": [\"https://…jpg\", …]}", example: {source: "PULL_FROM_URL", photo_cover_index: 0, photo_images: ["https://example.com/1.jpg"]}}
      bodyType: json
      note: "photo posts are PULL_FROM_URL ONLY — there is no FILE_UPLOAD path for photos, so the images must sit on a publicly reachable URL whose domain is verified in the TikTok developer portal, and there are no chunks to upload. Unlike video, `title` and `description` are separate fields here. Poll tiktok.publish.status as usual"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'included with the connected account; rate-limited per token, no per-call charge'}
    unverified: "write action — this publishes to a real TikTok account; requires a deliberate manual test, never an automated verify run"
    docs_url: https://developers.tiktok.com/doc/content-posting-api-reference-direct-post/

  - id: tiktok.tiktok.publish.status
    kind: utility
    capability: tiktok.publish.status
    platform: tiktok
    scope: own_account
    method: POST
    path: /v2/post/publish/status/fetch/
    name: "Check a TikTok upload's publish status"
    summary: "Check whether a TikTok upload has finished publishing"
    input:
      body:
        publish_id: {type: string, required: true, note: "from the init call's data.publish_id", example: "v_pub_file~v2.123456789"}
      bodyType: json
      note: "the closing step of every publish flow, and the only place a failure surfaces — an init call and a clean upload both succeed on content TikTok later rejects. status is PROCESSING_UPLOAD | PROCESSING_DOWNLOAD | SEND_TO_USER_INBOX | PUBLISH_COMPLETE | FAILED. On PUBLISH_COMPLETE, data.publicaly_available_post_id (TikTok's spelling) is an ARRAY whose first element is the post id — the URL is https://www.tiktok.com/@{username}/video/{that id}. It can be absent even on success, when the post is SELF_ONLY. Poll at ~20s intervals; TikTok's own reference implementation gives up after ~9 minutes"
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'included with the connected account; rate-limited per token, no per-call charge'}
    unverified: "part of the publish flow — only reachable with a publish_id a write call produced"
    docs_url: https://developers.tiktok.com/doc/content-posting-api-reference-get-video-status/

