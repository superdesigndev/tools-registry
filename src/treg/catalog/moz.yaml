provider: moz
source:
  docs: https://moz.com/help/links-api
  openapi: null # Moz publishes no machine-readable spec for the Links API
  curated: 2026-07-28
# Moz Links API V2 (https://lsapi.seomoz.com/v2) — every endpoint is POST with a JSON body and
# HTTP Basic auth (AccessID:SecretKey). Moz now labels V2 "legacy" in its help hub and points new
# integrations at a unified V3 JSON-RPC API (api.moz.com); V2 is still live and is what treg's
# registry entry (oauth_providers.MOZ.base_url) targets, so that is what is catalogued here.
#
# Billing model: Moz meters a ROW QUOTA per billing period, not per call — `cost.value` below is
# rows consumed by ONE call of the shape in `test_request`. For list endpoints one returned result
# = one row, so `limit` is the cost dial. Three endpoints are "weighted" and burn more than one row
# per result: link_intersect (5x per result), link_status (2x per source), url_metrics (+1 row per
# history/distribution modifier). POST /v2/usage_data reports rows consumed so far and is free.
# Errors use real HTTP status codes (400/401/403), so no `expect` blocks are needed.
#
# ROW COSTS MEASURED 2026-07-31 — every `cost` below now carries `source: observed`. Each endpoint
# was called once with exactly the `test_request` shown, with a free POST /v2/usage_data read
# immediately before and after, and rows_consumed moved by exactly the documented value on all ten
# priced endpoints — including all three WEIGHTED ones (link_status 2x, url_metrics+distributions
# 2x, link_intersect 5x), which were the figures most likely to be wrong and were not. The whole
# 12-endpoint sweep cost 17 rows. Moz's meter updates synchronously, which is what makes per-call
# attribution possible here and is NOT true of every row/credit provider (SE Ranking's lags ~30s
# and cannot be attributed this way).
#   The one CHANGE: /v2/index_metadata was `value: null, confidence: unknown` because the 07-28 run
#   had exhausted its quota before reaching it. It is 1 row.
#
# CONFIRMED ENDPOINT LIST: the API enumerated its own valid V2 actions in an error message, so this
# list is authoritative rather than transcribed from docs —
#   /v2/anchor_text, /v2/final_redirect, /v2/global_top_pages, /v2/global_top_root_domains,
#   /v2/index_metadata, /v2/link_intersect, /v2/link_status, /v2/linking_root_domains, /v2/links,
#   /v2/top_pages, /v2/url_metrics, /v2/usage_data
# There is NO /v2/quota route (oauth_providers.MOZ.probe_path points at one — registry bug).
#
# QUOTA TRAP — read before probing this provider: /v2/global_top_pages and /v2/global_top_root_domains
# have NO required parameters, so a "schema probe" with an empty body `{}` does not error, it returns
# the FULL default result set (25 rows each) and bills you for it. Two such probes burned this
# account's entire 50-row period allowance. The target-taking endpoints (url_metrics, links,
# anchor_text, linking_root_domains, top_pages) do reject `{}` for free with HTTP 400.
#
# VERIFICATION STATUS: three endpoints answered HTTP 200 and are stamped — moz.account.usage,
# moz.web.global.top_pages, moz.web.global.top_domains. The remaining nine are unverified because the
# credential's row quota was exhausted (they now all answer HTTP 403 {"issue": "insufficient-quota"});
# their paths and parameters come from the official V2 docs linked in each entry's docs_url.
pricing_url: https://moz.com/api/pricing
endpoints:
  - id: moz.web.url.metrics
    capability: web.url.metrics
    platform: web
    scope: any_account
    method: POST
    path: /url_metrics
    name: "Domain Authority, Page Authority and Spam Score by URL"
    summary: "Domain Authority, Page Authority, Spam Score and link counts for up to 50 URLs"
    input:
      bodyType: json
      body:
        targets: {type: "array[string]", required: true, note: "1-50 URLs or domains; a bare domain is treated as that page", example: ["moz.com"]}
        distributions: {type: boolean, required: false, note: "adds link distribution histograms; +1 row", example: false}
        daily_history_deltas: {type: "array[string]", required: false, note: "metrics to return 60d daily gains/losses for; +1 row per entry"}
        daily_history_values: {type: "array[string]", required: false, note: "metrics to return 60d daily values for; +1 row per entry"}
        monthly_history_deltas: {type: "array[string]", required: false, note: "as daily_history_deltas, over 32 months; +1 row per entry"}
        monthly_history_values: {type: "array[string]", required: false, note: "as daily_history_values, over 32 months; +1 row per entry"}
      note: "history params accept count metrics (pages_to_page, …), page_authority, domain_authority; you cannot select which base metrics come back — all are returned per target"
    test_request:
      body: {targets: ["moz.com"]}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: '1 row per target with no modifiers; each history list entry and `distributions: true` adds 1 row per target (weighted endpoint) OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.'
    verified: 2026-07-31
    example_response: examples/moz.web.url.metrics.json
    docs_url: https://moz.com/help/links-api/making-calls/url-metrics

  - id: moz.web.backlinks.summary
    capability: web.backlinks.summary
    platform: web
    scope: any_account
    method: POST
    path: /url_metrics
    name: "Backlinks summary by domain — authority, spam histograms"
    summary: "Aggregate backlink profile plus histograms by DA, spam score and root domains"
    input:
      bodyType: json
      body:
        targets: {type: "array[string]", required: true, note: "1-50 URLs or domains", example: ["moz.com"]}
        distributions: {type: boolean, required: true, note: "must be true for the aggregate histograms that make this a backlink summary", example: true}
      note: "Moz has no dedicated backlink-summary endpoint — url_metrics IS the summary: it returns pages_to_root_domain, root_domains_to_root_domain, nofollow/redirect/deleted splits etc. This entry is the same path called with distributions:true, which adds METRIC_by_MEASURE histograms (bucketed by root_domains, domain_authority, spam_score). Use moz.web.url.metrics when you only need DA/PA/Spam Score."
    test_request:
      body: {targets: ["moz.com"], distributions: true}
    cost:
      type: quota_rows
      value: 2
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per target + 1 row for the distributions modifier OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.backlinks.summary.json
    docs_url: https://moz.com/help/links-api/making-calls/url-metrics

  - id: moz.web.backlinks.list
    capability: web.backlinks.list
    platform: web
    scope: any_account
    method: POST
    path: /links
    name: "Backlinks by domain or URL — source and target metrics"
    summary: "Individual inbound links, with full URL metrics for both source and target"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "URL to get links for", example: "moz.com/blog"}
        target_scope: {type: string, required: false, note: "page | subdomain | root_domain (default page)", example: "page"}
        filter: {type: string, required: false, note: "default 'external'; combine with '+', e.g. external+follow, external+nofollow, external+deleted, external+not_redirect"}
        sort: {type: string, required: false, note: "default source_page_authority; also source_domain_authority, source_spam_score, source_link_propensity, root_domains_to_source_page/_root_domain"}
        anchor_text: {type: string, required: false, note: "only links whose normalised anchor text equals this; \"\\u0000\" matches empty anchor text"}
        source_root_domain: {type: string, required: false, note: "only links from this source root domain"}
        source_scope: {type: string, required: false, note: "page | subdomain | root_domain (default page) — at subdomain/root_domain returns only the best link per source"}
        subdomains_limited_to_one: {type: "array[string]", required: false, note: "return only the best link from each listed subdomain"}
        limit: {type: number, required: false, note: "1-50, default 25 — this is the cost dial", example: 1}
        next_token: {type: string, required: false, note: "cursor from a previous response's next_token"}
      note: "not every sort/filter works with anchor_text, source_root_domain or subdomains_limited_to_one — see the Parameter Compatibility table in the docs"
    test_request:
      body: {target: "moz.com/blog", target_scope: "page", filter: "external", limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned link; `limit` (1-50) sets the ceiling OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.backlinks.list.json
    docs_url: https://moz.com/help/links-api/making-calls/links

  - id: moz.web.linking_domains.list
    capability: web.linking_domains.list
    platform: web
    scope: any_account
    method: POST
    path: /linking_root_domains
    name: "Referring domains by domain or URL — authority, spam"
    summary: "Root domains linking to a target, with each source's DA, spam score and link counts"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, example: "moz.com"}
        target_scope: {type: string, required: false, note: "page | subdomain | root_domain (default page)", example: "root_domain"}
        filter: {type: string, required: false, note: "default 'external'; external+[follow|nofollow|deleted|not_deleted]; external+gained_last_60_days / +lost_last_60_days for link velocity"}
        sort: {type: string, required: false, note: "default source_domain_authority; also source_link_propensity, source_spam_score, date_gained, date_lost"}
        begin_date: {type: string, required: false, note: "YYYY-MM-DD; only valid when sort is date_gained or date_lost"}
        end_date: {type: string, required: false, note: "YYYY-MM-DD; only valid when sort is date_gained or date_lost"}
        limit: {type: number, required: false, note: "1-50, default 25", example: 1}
        next_token: {type: string, required: false}
      note: "positive filters need one matching link from the source domain, negative filters need ALL links to match (e.g. 'nofollow' = every link from that domain is nofollow)"
    test_request:
      body: {target: "moz.com", target_scope: "root_domain", filter: "external", limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned root domain; `limit` (1-50) sets the ceiling OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.linking_domains.list.json
    docs_url: https://moz.com/help/links-api/making-calls/linking-root-domains

  - id: moz.web.anchors.list
    capability: web.anchors.list
    platform: web
    scope: any_account
    method: POST
    path: /anchor_text
    name: "Anchor texts in backlinks by domain or URL"
    summary: "Anchor-text distribution of inbound links, with domain and page counts per phrase"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, example: "moz.com"}
        scope: {type: string, required: false, note: "page | subdomain | root_domain (default page)", example: "root_domain"}
        limit: {type: number, required: false, note: "1-50, default 25", example: 1}
        next_token: {type: string, required: false}
      note: "results are always ordered by external_root_domains descending; there is no sort parameter"
    test_request:
      body: {target: "moz.com", scope: "root_domain", limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned anchor-text phrase; `limit` (1-50) sets the ceiling OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.anchors.list.json
    docs_url: https://moz.com/help/links-api/making-calls/anchor-text

  - id: moz.web.site.top_pages
    capability: web.site.top_pages
    platform: web
    scope: any_account
    method: POST
    path: /top_pages
    name: "Highest-authority pages by domain, with URL metrics"
    summary: "Highest-authority pages of a domain, with full URL metrics per page"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, note: "the domain to return top pages for", example: "moz.com"}
        scope: {type: string, required: false, note: "subdomain | root_domain (default root_domain)", example: "root_domain"}
        sort: {type: string, required: false, note: "page_authority (default) | root_domains_to_page | external_pages_to_page"}
        filter: {type: string, required: false, note: "all (default) | status_200 | status_301 | status_302 | status_4xx | status_5xx — filter status_4xx surfaces broken pages that still have links"}
        daily_history_deltas: {type: "array[string]", required: false, note: "as in url_metrics, applied to each result"}
        daily_history_values: {type: "array[string]", required: false}
        monthly_history_deltas: {type: "array[string]", required: false}
        monthly_history_values: {type: "array[string]", required: false}
        limit: {type: number, required: false, note: "1-50, default 25", example: 1}
        next_token: {type: string, required: false}
    test_request:
      body: {target: "moz.com", scope: "root_domain", limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned page; history modifiers add rows as in url_metrics OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.site.top_pages.json
    docs_url: https://moz.com/help/links-api/making-calls/top-pages

  - id: moz.web.backlinks.status
    capability: web.backlinks.status
    platform: web
    scope: any_account
    method: POST
    path: /link_status
    name: "Check whether specific sources link to a target domain"
    summary: "Check whether specific sources link to a target — returns one boolean per source"
    input:
      bodyType: json
      body:
        target: {type: string, required: true, example: "moz.com/blog"}
        sources: {type: "array[string]", required: true, note: "up to 50 sources; the response's `exists` array is in the same order", example: ["twitter.com"]}
        target_scope: {type: string, required: false, note: "page | subdomain | root_domain (default page)"}
        source_scope: {type: string, required: false, note: "page | subdomain | root_domain (default page)", example: "root_domain"}
      note: "the cheapest way to answer 'did my outreach link go live?' without pulling the whole backlink list"
    test_request:
      body: {target: "moz.com/blog", sources: ["twitter.com"], source_scope: "root_domain", target_scope: "page"}
    cost:
      type: quota_rows
      value: 2
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 'weighted endpoint: 2 rows per source (1 source = 2 rows, 50 sources = 100 rows) OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.'
    verified: 2026-07-31
    example_response: examples/moz.web.backlinks.status.json
    docs_url: https://moz.com/help/links-api/making-calls/link-status

  - id: moz.web.backlinks.intersect
    capability: web.backlinks.intersect
    platform: web
    scope: any_account
    method: POST
    path: /link_intersect
    name: "Sources linking to competitors but not you — link gap"
    summary: "Sources that link to the given competitors but not to you — link-gap prospecting"
    input:
      bodyType: json
      body:
        positive_targets: {type: "array[object]", required: true, note: "objects of {target, scope}; scope is page|subdomain|root_domain; max 6 targets across positive+negative", example: [{target: "moz.com", scope: "root_domain"}]}
        negative_targets: {type: "array[object]", required: false, note: "same shape; sources linking to any of these are excluded"}
        min_matching_targets: {type: number, required: false, note: "only return sources matching at least this many positive targets"}
        source_scope: {type: string, required: false, note: "page (default) | root_domain"}
        sort: {type: string, required: false, note: "matching_target_count (default) | source_domain_authority | source_spam_score"}
        limit: {type: number, required: false, note: "1-50, default 25 — expensive, keep low", example: 1}
        next_token: {type: string, required: false}
    test_request:
      body:
        positive_targets: [{target: "moz.com", scope: "root_domain"}]
        source_scope: "page"
        limit: 1
    cost:
      type: quota_rows
      value: 5
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 'weighted endpoint: 5 rows per RETURNED result (limit 1 = 5 rows, limit 50 = 250 rows). Fewer results than `limit` cost proportionally less. OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.'
    verified: 2026-07-31
    example_response: examples/moz.web.backlinks.intersect.json
    docs_url: https://moz.com/help/links-api/making-calls/link-intersect

  - id: moz.web.index.metadata
    capability: web.index.metadata
    platform: web
    scope: any_account
    method: POST
    path: /index_metadata
    name: "Current Moz link index version"
    summary: "Which Moz link index is serving results — tells you if metrics moved on a refresh"
    input:
      bodyType: json
      body: {}
      note: "takes no parameters; the body must still be an empty JSON object"
    test_request:
      body: {}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      checked: '2026-07-31'
      confidence: verified
      note: '1 row per call. OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after; rows_consumed moved by exactly 1. This closes the previous `value: null, confidence: unknown`, which existed only because the test credential had been out of quota on 2026-07-28 — the endpoint gates on quota (403 insufficient-quota), so it was never free, just unmeasurable at the time.'
    verified: 2026-07-31
    example_response: examples/moz.web.index.metadata.json
    docs_url: https://moz.com/help/links-api/making-calls/index-metadata

  - id: moz.account.usage
    kind: account
    capability: account.usage
    platform: account
    scope: own_account
    method: POST
    path: /usage_data
    name: "Account usage — quota rows consumed this period"
    summary: "Rows consumed this period — Moz's quota meter, covering both V1 and V2 usage"
    input:
      bodyType: json
      body:
        start: {type: string, required: false, note: "Unix seconds as a STRING; defaults to the start of the current month", example: "1751328000"}
        end: {type: string, required: false, note: "Unix seconds as a STRING; defaults to now; must be greater than start"}
      note: "send {} for the current billing period. The count can lag by up to an hour. The captured example's rows_consumed value is masked — it is a real number in responses, account-specific."
    test_request:
      body: {}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      note: answers 200 even when the account's row quota is fully exhausted, so it costs nothing and is the right liveness probe for a Moz key
    verified: 2026-07-31
    example_response: examples/moz.account.usage.json
    docs_url: https://moz.com/help/links-api/making-calls/usage-data

  # THE QUOTA TRAP — no required params: an empty body returns 25 rows and bills for them.
  - id: moz.web.global.top_pages
    capability: web.global.top_pages
    platform: web
    scope: any_account
    method: POST
    path: /global_top_pages
    name: "Most-linked pages on the web — index-wide, no target"
    summary: "Most-linked pages on the web, with full URL metrics (index-wide, takes no target)"
    input:
      bodyType: json
      body:
        limit: {type: number, required: false, note: "1-50, DEFAULT 25 — always send this; omitting it bills 25 rows", example: 1}
        next_token: {type: string, required: false, note: "cursor from a previous response's next_token"}
      note: "no required parameters — an empty body {} is a valid, billable request returning the default 25 rows"
    test_request:
      body: {limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned page; defaults to 25 rows when `limit` is omitted OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.global.top_pages.json
    docs_url: https://moz.com/help/links-api/making-calls/global-top-pages

  # THE QUOTA TRAP — no required params: an empty body returns 25 rows and bills for them.
  - id: moz.web.global.top_domains
    capability: web.global.top_domains
    platform: web
    scope: any_account
    method: POST
    path: /global_top_root_domains
    name: "Most-linked domains on the web — Domain Authority, spam"
    summary: "Most-linked root domains on the web, with DA and spam score (index-wide, no target)"
    input:
      bodyType: json
      body:
        limit: {type: number, required: false, note: "1-50, DEFAULT 25 — always send this; omitting it bills 25 rows", example: 1}
        next_token: {type: string, required: false, note: "cursor from a previous response's next_token"}
      note: "no required parameters — an empty body {} is a valid, billable request returning the default 25 rows"
    test_request:
      body: {limit: 1}
    cost:
      type: quota_rows
      value: 1
      currency: unit
      per: 1
      unit: quota_row
      source: observed
      source_url: https://moz.com/api/pricing
      checked: '2026-07-31'
      confidence: verified
      note: 1 row per returned root domain; defaults to 25 rows when `limit` is omitted OBSERVED 2026-07-31 — measured against POST /v2/usage_data (free) immediately before and after this exact test_request; rows_consumed moved by exactly this value.
    verified: 2026-07-31
    example_response: examples/moz.web.global.top_domains.json
    docs_url: https://moz.com/help/links-api/making-calls/global-top-root-domains
