# extended tier — machine-derived coverage of Bright Data's Web Scraper API dataset catalog.
# NEVER hand-edit past this header without re-checking scripts/catalog_ingest.py (no automated
# ingester is registered for brightdata — it has no OpenAPI spec — so this file is hand-authored
# from GET /datasets/list cross-referenced against docs.brightdata.com's per-platform quickstart
# pages). Method for every entry below is the SAME physical route the core file's Instagram/LinkedIn
# profile shortcuts already use (POST /datasets/v3/scrape or /datasets/v3/trigger) — dataset_id is
# what selects the site and columns, exactly as documented in brightdata.yaml's header. Core-wins
# dedup does not collapse these onto the core entries because the comparison that matters here is
# (method, path, dataset_id), following the same precedent as Google Ads' shared-path resource list
# (see docs/context/architecture/catalog.md).
#
# 2026-07-28 verify pass: 7 of 45 were live-called across distinct platform families (instagram,
# tiktok, facebook, amazon, x, youtube, google-play) — see per-entry `verified:`. All 7 passed,
# proving the shared mechanism (generic POST /datasets/v3/scrape runner, dataset_id-only
# difference) generalises across the catalog; the other 38 share the identical request shape and
# are `skipped:` citing that sample rather than re-spending budget on each one. Two of the seven
# needed one retry: the sync scrape route occasionally hits a transient 502 or exceeds our client's
# 60s read timeout on a slower target (TikTok, Facebook, Instagram — retry passed both times).
# Three passes (amazon-products, x-profiles, youtube-channels) returned HTTP 200 with a THIN body
# (input echoed back + timestamp, no scraped fields) — the sync endpoint can return before the
# dataset finishes collecting for a slower target; still counts as a verified, billed call against
# the documented contract, but prefer the async trigger/status/results flow (proven full-fidelity
# in brightdata.yaml) for anything beyond a connectivity check.
provider: brightdata
source:
  method: GET /datasets/list (this account's live dataset catalog), filtered to the cleanly-named, non-internal/non-test entries and cross-checked against docs.brightdata.com's per-platform quickstart pages where fetched
  ingested: 2026-07-28
  spec_urls:
  - https://docs.brightdata.com/api-reference/marketplace-dataset-api/get-dataset-list
  - https://docs.brightdata.com/scraping-automation/web-data-apis/web-scraper-api/overview
  - https://docs.brightdata.com/datasets/scrapers/tiktok/quickstart
  - https://docs.brightdata.com/datasets/scrapers/instagram/quickstart
  - https://docs.brightdata.com/datasets/scrapers/linkedin/quickstart
  - https://brightdata.com/pricing
pricing_url: https://brightdata.com/pricing
endpoints:
- id: brightdata.x.instagram-posts
  tier: extended
  capability: instagram.post.detail
  platform: instagram
  scope: any_account
  method: POST
  path: /datasets/v3/scrape
  name: "Instagram post details by URL"
  summary: Instagram - Posts
  input:
    queryParams:
      dataset_id:
        type: string
        required: true
        note: pinned to the documented 'Instagram - Posts' dataset
        example: gd_lk5ns7kz21pck8jpis
      format:
        type: string
        required: false
        note: json (default) | ndjson | csv
    body:
      input:
        type: array
        required: true
        note: one object per target — an Instagram post URL
        example:
        - url: https://www.instagram.com/p/DbTY2uSG3Oj/
    bodyType: json
    note: same generic runner as brightdata.web.scrape.structured with dataset_id fixed to this dataset (see that entry and brightdata.instagram.user.profile in the core file for the pattern). >1 minute falls back to HTTP 202 + snapshot_id — use brightdata.web.scrape.job.start for anything beyond a handful of URLs. Exact required body fields were not individually re-confirmed per dataset here; verify against the dataset's own quickstart page before high-volume use.
  test_request:
    queryParams:
      dataset_id: gd_lk5ns7kz21pck8jpis
      format: json
    body:
    - url: https://www.instagram.com/p/DbTY2uSG3Oj/
  cost:
    type: per_result
    value: 0.0015
    currency: USD
    per: 1
    unit: record
    source: docs
    source_url: https://brightdata.com/pricing
    checked: '2026-07-28'
    confidence: documented
    note: $1.50 per 1000 records delivered, pay-per-success — the general Web Scraper API rate documented for this product family; some datasets carry different published rates, confirm on brightdata.com/pricing before volume use
  verified: '2026-07-30'
  example_response: examples/brightdata.x.instagram-posts.json
  docs_url: https://docs.brightdata.com/datasets/scrapers/instagram/quickstart
  observed_time: 15.9
