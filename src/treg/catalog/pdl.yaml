provider: pdl
source:
  docs: https://docs.peopledatalabs.com/docs/api-overview
  openapi: null # PDL documents its API on readme.io; no fetchable OpenAPI document is published
  curated: 2026-07-28
# VERIFIED 2026-07-28, RE-VERIFIED 2026-07-31 — all 5 core endpoints called live and passed with a
# real credential; examples captured under examples/. Paths, parameters and price notes below were
# originally transcribed from People Data Labs' official docs 2026-07-28.
#
# PDL REPORTS EVERY CHARGE IN RESPONSE HEADERS, which is how the credit counts below stopped being
# transcriptions. Observed live 2026-07-31:
#   x-call-credits-spent: 1        what THIS call cost
#   x-call-credits-type: enrich    which meter it came out of (also seen: search_company)
#   x-totallimit-remaining: 96     what is left of the plan's allowance
#   x-lifetime-used / x-totallimit-purchased-remaining / x-totallimit-overages-remaining
#   x-ratelimit-limit / -remaining / -reset   as JSON objects, e.g. {"minute": 100}
# Read x-call-credits-spent rather than reasoning about the price list. Worth knowing: the enrich
# and search meters are separate — a company-search call that spent 1 credit left
# x-totallimit-remaining unchanged at 96, so the enrich allowance is not what search draws down.
#
# Methods below come from PDL's own OpenAPI spec (https://docs.peopledatalabs.com/api-reference/
# openapi.json), which is authoritative — PDL's prose docs contradict it in places (one page calls
# company enrichment a POST; the spec says GET only). Both ENRICH endpoints are GET-only. Both
# SEARCH endpoints accept GET or POST, and on person search that choice changes the limit: GET caps
# `size` at 100, POST at 1000. Prefer POST for person search when you want a big page.
#
# Billing: PDL sells CREDITS against a plan and does not publish a $/credit (it is negotiated), so
# `cost.value` is null and the credit rule is in `cost.note`. Enrichment charges 1 credit only when
# a record comes back (HTTP 200); a miss (404) is free, and enriching the same person twice costs
# twice. SEARCH is the expensive one: 1 credit PER RECORD returned, so `size` is the cost dial.
# The Autocomplete API and the Cleaner APIs (/company/clean, /location/clean, /school/clean) are
# free; note that /job_title/enrich, despite looking like a lookup utility, is NOT.

limits: "per-minute rate limit varies by plan"
pricing_url: https://www.peopledatalabs.com/pricing  # Only a match at or above `min_likelihood` is billed.; free tier: 100 matches/month (developer tier)
endpoints:
  - id: pdl.people.enrich
    domain: contacts
    capability: people.enrich
    platform: people
    scope: any_account
    method: GET
    path: /person/enrich
    name: "Enrich a person from email or name"
    summary: "Enrich a person from email, LinkedIn or name + company — job history, skills, contact"
    input:
      queryParams:
        email: {type: string, required: false, note: "strongest single identifier", example: "sean@peopledatalabs.com"}
        phone: {type: string, required: false, note: "E.164 preferred"}
        profile: {type: string, required: false, note: "social profile URL — LinkedIn, GitHub, Twitter, Facebook", example: "linkedin.com/in/seanthorne"}
        lid: {type: string, required: false, note: "LinkedIn numeric profile id"}
        email_hash: {type: string, required: false, note: "MD5 or SHA-256 of the email, when you cannot send it in the clear"}
        name: {type: string, required: false, note: "full name; use with company or location to disambiguate"}
        first_name: {type: string, required: false}
        last_name: {type: string, required: false}
        company: {type: string, required: false, note: "employer name or domain", example: "peopledatalabs"}
        school: {type: string, required: false}
        location: {type: string, required: false, note: "free-text location of the person"}
        country: {type: string, required: false}
        min_likelihood: {type: integer, required: false, note: "1-10 match-confidence floor; PDL returns 404 below it. 6+ is the usual production setting", example: 6}
        required: {type: string, required: false, note: "fields the response must contain or it is treated as a miss, e.g. 'emails AND profiles'"}
        titlecase: {type: boolean, required: false}
        pretty: {type: boolean, required: false}
      note: "PDL's minimum-input rule, verbatim: profile OR email OR phone OR email_hash OR lid OR ((first_name AND last_name, or name) AND (locality OR region OR company OR school OR location OR postal_code)). A bare name is never enough on its own"
    test_request:
      queryParams: {email: "sean@peopledatalabs.com"}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: observed
      source_url: https://www.peopledatalabs.com/pricing
      checked: '2026-07-31'
      confidence: verified
      note: '1 PDL credit per person returned (HTTP 200); a 404 is free. OBSERVED live 2026-07-31 - the response carried x-call-credits-spent 1 and x-call-credits-type enrich. Enriching the same person twice costs 2 credits, PDL does not de-duplicate. cost.usd stays null because there is no public $/credit - the rate is plan-negotiated - so this is a verified CREDIT count, not a verified dollar figure.'
    miss:
      status: 404
      means: "no person matched (or none above min_likelihood) — an expected outcome (and free, per the cost note), not an API failure; do not retry the same identifiers"
    verified: 2026-07-31
    example_response: examples/pdl.people.enrich.json
    docs_url: https://docs.peopledatalabs.com/docs/reference-person-enrichment-api

  - id: pdl.people.search
    domain: contacts
    capability: people.search
    platform: people
    scope: any_account
    method: GET
    path: /person/search
    name: "Search people by title, company, skills"
    summary: "Search PDL people by title, company, seniority, skills or location — pays per record"
    input:
      queryParams:
        sql: {type: string, required: false, note: "SQL WHERE clause over the Person schema, e.g. \"SELECT * FROM person WHERE job_title_role='engineering' AND location_country='united states'\""}
        query: {type: string, required: false, note: "Elasticsearch JSON query — the alternative to sql, more expressive"}
        size: {type: integer, required: false, note: "records to return, 1-100, default 1 — THIS IS THE PRICE DIAL: you pay 1 credit per record", example: 1}
        scroll_token: {type: string, required: false, note: "cursor from the previous response, for paging past 100"}
        dataset: {type: string, required: false, note: "restrict to a licensed dataset, e.g. resume, email, phone"}
        titlecase: {type: boolean, required: false}
        pretty: {type: boolean, required: false}
      note: "exactly one of sql | query. GET caps `size` at 100, POST at 1000 — the only real difference between the two methods. Always set an explicit small size while iterating: you pay per record, so a size=100 call is a 100-credit call. Rate limit 10 req/min"
    test_request:
      queryParams: {sql: "SELECT * FROM person WHERE location_country='united states'", size: 1}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: docs
      source_url: https://www.peopledatalabs.com/pricing
      checked: '2026-07-28'
      confidence: documented
      note: 1 PDL credit PER RECORD in the data array — a size=100 call costs 100 credits, a size=1000 POST costs 1000. A query matching nothing is free.
    verified: 2026-07-31
    example_response: examples/pdl.people.search.json
    docs_url: https://docs.peopledatalabs.com/docs/reference-person-search-api

  - id: pdl.companies.enrich
    domain: companies
    capability: companies.enrich
    platform: companies
    scope: any_account
    method: GET
    path: /company/enrich
    name: "Enrich a company from website or name"
    summary: "Enrich a company from website, name or ticker — industry, size, founded, location"
    input:
      queryParams:
        website: {type: string, required: false, note: "company domain — the strongest identifier", example: "peopledatalabs.com"}
        name: {type: string, required: false, note: "company name; ambiguous on its own, pair with location"}
        profile: {type: string, required: false, note: "LinkedIn company URL", example: "linkedin.com/company/peopledatalabs"}
        ticker: {type: string, required: false, note: "stock ticker for public companies", example: "AAPL"}
        location: {type: string, required: false, note: "free-text HQ location, to disambiguate a name"}
        locality: {type: string, required: false}
        region: {type: string, required: false}
        country: {type: string, required: false}
        street_address: {type: string, required: false}
        postal_code: {type: string, required: false}
        min_likelihood: {type: integer, required: false, note: "1-10 match-confidence floor; defaults to 2 here, lower than you might expect"}
        pretty: {type: boolean, required: false}
      note: "at least one of pdl_id | name | website | ticker | profile (pdl_id overrides the rest); website gives the highest match rate. The other fields only disambiguate"
    test_request:
      queryParams: {website: "peopledatalabs.com"}
    cost:
      type: per_success
      value: 1
      currency: credit
      per: 1
      unit: call
      source: docs
      source_url: https://www.peopledatalabs.com/pricing
      checked: '2026-07-28'
      confidence: documented
      note: 1 PDL credit per company returned; a 404 is free.
    verified: 2026-07-31
    example_response: examples/pdl.companies.enrich.json
    docs_url: https://docs.peopledatalabs.com/docs/reference-company-enrichment-api

  - id: pdl.companies.search
    domain: companies
    capability: companies.search
    platform: companies
    scope: any_account
    method: GET
    path: /company/search
    name: "Search companies by industry, size, location"
    summary: "Search PDL companies by industry, headcount, location or tags — pays per record"
    input:
      queryParams:
        sql: {type: string, required: false, note: "SQL WHERE clause over the Company schema, e.g. \"SELECT * FROM company WHERE industry='computer software' AND size='51-200'\""}
        query: {type: string, required: false, note: "Elasticsearch JSON query — the alternative to sql"}
        size: {type: integer, required: false, note: "records to return, 1-100, default 1 — you pay 1 credit per record", example: 1}
        scroll_token: {type: string, required: false, note: "cursor from the previous response"}
        titlecase: {type: boolean, required: false}
        pretty: {type: boolean, required: false}
      note: "exactly one of sql | query. Unlike person search, company search caps `size` at 100 on BOTH methods, and the spec does not offer scroll_token here. Rate limit 10 req/min"
    test_request:
      queryParams: {sql: "SELECT * FROM company WHERE name='people data labs'", size: 1}
    cost:
      type: per_result
      value: 1
      currency: credit
      per: 1
      unit: record
      source: observed
      source_url: https://www.peopledatalabs.com/pricing
      checked: '2026-07-31'
      confidence: verified
      note: '1 PDL credit PER RECORD returned; `size` is the cost dial. OBSERVED live 2026-07-31 - a size=1 call returning 1 record carried x-call-credits-spent 1, x-call-credits-type search_company, and left the enrich allowance (x-totallimit-remaining) untouched: search bills a different meter.'
    verified: 2026-07-31
    example_response: examples/pdl.companies.search.json
    docs_url: https://docs.peopledatalabs.com/docs/reference-company-search-api

  - id: pdl.account.usage
    kind: utility
    capability: account.usage
    platform: account
    scope: own_account
    method: GET
    path: /autocomplete
    name: "Get autocomplete suggestions for filter fields"
    summary: "Check the key works and get suggested values for a filter field (free — 0 credits)"
    input:
      queryParams:
        field: {type: string, required: true, note: "which vocabulary to complete: title, company, school, skill, role, sub_role, industry, major, location, country, region, tag", example: "title"}
        text: {type: string, required: false, note: "prefix to complete; empty returns the most common values", example: "data"}
        size: {type: integer, required: false, note: "suggestions to return, max 100, default 10", example: 5}
        titlecase: {type: boolean, required: false}
        pretty: {type: boolean, required: false}
      note: "doubles as the free key-health check (it is the registry's probe) and as the way to discover the exact filter values the search endpoints expect. Rate-limited to 60/min and 1,000/day, and a zero-result call still counts against that daily cap"
    test_request:
      queryParams: {field: "title", text: "data", size: 5}
    cost: {type: free, value: 0, currency: USD, unit: call, note: 'free — PDL states all active keys have free access to Autocomplete, and a live call 2026-07-31 returned no x-call-credits-spent header at all, only the rate-limit ones. Rate-limited to 60/min and 1,000/day. The Cleaner APIs (/company/clean, /location/clean, /school/clean) are likewise free, 10,000/month'}
    verified: 2026-07-31
    example_response: examples/pdl.account.usage.json
    docs_url: https://docs.peopledatalabs.com/docs/reference-autocomplete-api
