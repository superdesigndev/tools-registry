- id: akta.x.company-addition
  kind: account
  tier: extended
  platform: companies
  method: POST
  path: /v1/company/addition-requests/
  name: "Request a company be added to Akta — free"
  summary: Submits a company that is not yet in akta.pro's database to be added, returning a request ID to track, or the existing company if it is already present. This is a free endpoint — it does not consume API credits.
  input:
    body:
      company_name:
        type: string
        required: true
        note: name of the company to add
        example: solios
      website:
        type: string
        required: true
        note: primary website URL, used to disambiguate and resolve the company
        example: https://www.soleosenergy.com/
    bodyType: json
    note: if the company already exists, no request is created and the existing company's details are returned directly instead of a request_id
  untestable: writes a real addition request against Akta's database with no safe/no-op input — a live call would create persistent state on their side, not just spend credits
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: documented free — does not consume credits
  docs_url: https://docs.akta.pro/api-reference/supporting-apis/company-addition-api
- id: akta.x.request-status
  kind: utility
  tier: extended
  platform: companies
  method: GET
  path: /v1/status/{request_id}/
  name: "Check an async Akta request by request id"
  summary: Returns the current status of an asynchronous request, such as a company addition request, by its request ID. This is a free endpoint — it does not consume API credits.
  input:
    pathParams:
      request_id:
        type: string
        required: true
        note: the request id returned when the original (e.g. company-addition) request was submitted
        example: 2db01b38-5c81-4b3f-b76d-8b36aeed603b
  untestable: requires a real request_id minted by a prior company-addition call, which no example value can substitute for
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    confidence: documented
    note: documented free — does not consume credits
  docs_url: https://docs.akta.pro/api-reference/supporting-apis/request-status
