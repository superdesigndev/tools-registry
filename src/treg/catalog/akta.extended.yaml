- id: akta.x.product-reviews
  domain: other
  tier: extended
  platform: companies
  method: GET
  path: /v1/company/product-reviews/
  name: "Company product catalog and reviews by website — ratings"
  summary: Fetches a company's product catalog and detailed reviews per product including ratings, star distribution, pros, cons, pricing and individual review content.
  input:
    queryParams:
      company:
        type: string
        required: true
        note: company website (e.g. 'canva.com') or a company UUID from Company Search
        example: canva.com
      products:
        type: array
        required: false
        note: product_id values to fetch reviews for (repeat the param per id); omitted → returns the free product list only, no reviews
      limit:
        type: integer
        required: false
        note: max reviews to return per product, default 0, max 50 — only applies when products is set
        example: 0
      offset:
        type: integer
        required: false
        note: reviews to skip before returning records, default 0
    note: 'two-step API: call without `products` first — free, returns the product catalog and its ids; call again with `products` to bill for reviews. 1.5 credits per 50 reviews returned.'
  test_request:
    queryParams:
      company: canva.com
  cost:
    type: per_result
    value: 1.5
    currency: credit
    per: 50
    unit: review
    source: docs
    source_url: https://docs.akta.pro/getting-started/pricing
    checked: '2026-07-28'
    confidence: documented
    note: 0.0 credits for the product-list-only call (no `products` param); 1.5 credits per 50 reviews returned once `products` is passed — value here is the marginal per-50-reviews rate that applies once billed
  platform_blocked: "upstream 403 'Your current subscription does not include access to this endpoint' on treg's shared Akta key (alternative-data tier; re-probed 2026-07-31). Works with your own Akta key on a plan that includes Alternative Signals."
  docs_url: https://docs.akta.pro/api-reference/alternative-data/product-reviews
